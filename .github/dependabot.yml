# Dependabot version updates. Security *alerts* are already enabled on the
# repository and drive the fix(deps) history; scheduled version updates keep
# both uv locks current and move the SHA-pinned workflow actions, which no
# other path can do.
version: 2

updates:
  # Application runtime + dev dependencies (pyproject.toml, uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per weekly batch of non-breaking bumps keeps main's history
      # readable; majors stay separate so they get their own review.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Held below 0.4 deliberately: ragas imports a langchain-community module
      # that 0.4 removed, so raising this breaks the evaluator at import time.
      # Dependabot proposed exactly that bump and CI caught it; the constraint
      # carries the reason in pyproject.toml. Revisit when the parser's document
      # loaders move off langchain-community (it is in sunset as of 0.4).
      - dependency-name: "langchain-community"
        versions: [">=0.4.0"]
      # 3.8 added the `discard()` step and sends `Cardinality.single` writes
      # through it; Neptune rejects the step, so every graph write fails and an
      # ingest indexes 0 entities. This bump WAS merged and only a real-AWS run
      # caught it — the fake Neptune client in the unit suite cannot. Raise when
      # Neptune's engine supports TinkerPop 3.8.
      - dependency-name: "gremlinpython"
        versions: [">=3.8.0"]

  # CDK app (iac/pyproject.toml, iac/uv.lock). A separate uv project, kept out
  # of the root lock on purpose: it is deployment tooling that ships nothing and
  # shares no runtime with the package, so keeping it separate avoids coupling
  # the app's resolution to the CDK dependency tree (notably jsii's exact
  # `typeguard` pin). Updates go through `uv lock`, so a transitive bump that
  # the pinned aws-cdk-lib cannot admit fails to resolve instead of opening a
  # PR that cannot install. The root entry above does not touch these files:
  # Dependabot's uv parser and lock updater read only the `uv.lock` at the
  # entry's own directory, and iac/ holds no requirements files.
  - package-ecosystem: "uv"
    directory: "/iac"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
    groups:
      aws-cdk:
        # aws-cdk-lib and aws-cdk.aws-neptune-alpha are released in lockstep and
        # the alpha module pins an exact aws-cdk-lib version, so bumping one
        # without the other cannot resolve.
        patterns: ["aws-cdk*", "constructs"]
    ignore:
      # cdk-nag 3.0 no longer exports NagSuppressions, which nag_suppressions.py
      # imports, so `cdk synth` fails at import time. Porting to the 3.x API is
      # its own change; until then a bump here only produces a red PR. Drop this
      # entry as part of that migration.
      - dependency-name: "cdk-nag"
        versions: [">=3.0.0"]
      # jsii pins typeguard==2.13.3: a bump alone cannot resolve. Drop this
      # when the newest jsii admits it.
      - dependency-name: "typeguard"
        versions: [">=3.0.0"]

  # Workflow actions are pinned to commit SHAs (see .github/workflows/*.yml), so
  # they are invisible to every other update path.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

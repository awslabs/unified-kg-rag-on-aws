name: release

# Build the sdist and wheel for a version tag and publish them as a GitHub
# release, with the notes from that version's CHANGELOG.md section.
# workflow_dispatch is a dry run: it builds and checks the same artifacts (the
# notes fall back to [Unreleased]) and publishes nothing. No PyPI upload yet;
# CONTRIBUTING.md ("Releasing") describes the planned trusted-publishing job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per tag (or branch, for a dry run); never cancel a release midway.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and the uploaded artifacts must not carry the token.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"
          # Release artifacts are built from a cold cache, never one another
          # workflow run wrote.
          enable-cache: false

      - name: Check the tag matches the package version and write the notes
        # A tag push fails unless the tag is v<__version__> and CHANGELOG.md
        # has a non-empty section for that version. The dry run uses the
        # package version and falls back to [Unreleased].
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          NOTES_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md
        run: |
          if [ "$EVENT" = "push" ]; then
            uv run --no-project python scripts/changelog_section.py "$TAG" \
              --check-package --full-notes-url "$NOTES_URL" > release-notes.md
          else
            version="$(uv run --no-project python scripts/changelog_section.py --print-package-version)"
            uv run --no-project python scripts/changelog_section.py "$version" \
              --check-package --fallback-unreleased --full-notes-url "$NOTES_URL" > release-notes.md
          fi
          wc -c release-notes.md

      - name: Build the sdist and wheel
        run: uv build --out-dir dist

      - name: Check the distribution metadata
        run: uvx twine@7.0.0 check --strict dist/*

      - name: Check the artifacts' version and contents
        # One sdist and one wheel of the package version; both carry LICENSE
        # and NOTICE (Apache-2.0 section 4), and the wheel holds only the
        # package and its metadata.
        run: |
          version="$(uv run --no-project python scripts/changelog_section.py --print-package-version)"
          sdist="dist/unified_kg_rag_on_aws-${version}.tar.gz"
          wheel="dist/unified_kg_rag_on_aws-${version}-py3-none-any.whl"
          # uv build also writes dist/.gitignore.
          test "$(find dist -maxdepth 1 -type f ! -name '.*' | wc -l)" -eq 2
          test -f "$sdist" && test -f "$wheel"
          # Listings go through variables: under the runner's pipefail,
          # `tar | grep -q` fails when grep exits early.
          wheel_files="$(unzip -Z1 "$wheel")"
          sdist_files="$(tar -tzf "$sdist")"
          for f in LICENSE NOTICE; do
            grep -qx "unified_kg_rag_on_aws-${version}.dist-info/licenses/${f}" <<<"$wheel_files"
            grep -qx "unified_kg_rag_on_aws-${version}/${f}" <<<"$sdist_files"
          done
          if [ -f unified_kg_rag/py.typed ]; then
            grep -qx "unified_kg_rag/py.typed" <<<"$wheel_files"
          fi
          if grep -vE "^(unified_kg_rag/|unified_kg_rag_on_aws-${version}\.dist-info/)" <<<"$wheel_files"; then
            echo "unexpected files in the wheel (above)" >&2
            exit 1
          fi

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/wheel-venv" uv pip install dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import unified_kg_rag, sys; print(unified_kg_rag.__version__)"
          "$RUNNER_TEMP/wheel-venv/bin/run-rag" --help > /dev/null

      - name: Upload the artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  github-release:
    # Tag pushes only: the dry run stops after the build job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts

      - name: Create the GitHub release
        # A version with a pre-release segment (a, b, rc, dev) is marked as a
        # pre-release, so it never becomes the repository's "latest" release.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${prerelease[@]}"

name: licenses

# Dependency license check (every extra's runtime dependencies). Runs only when
# the dependency set changes: syncing every extra pulls the CUDA build of torch
# from the [local] extra, which is too heavy for every PR.

on:
  push:
    branches: [main]
    paths: [pyproject.toml, uv.lock, .github/scripts/check_licenses.py, .github/workflows/licenses.yml]
  pull_request:
    paths: [pyproject.toml, uv.lock, .github/scripts/check_licenses.py, .github/workflows/licenses.yml]

permissions:
  contents: read

jobs:
  licenses:
    # Fail on copyleft, source-available or unlabeled licenses among the
    # runtime dependencies of every extra (dev tools are not redistributed).
    # Reviewed exceptions are listed in .github/scripts/check_licenses.py.
    # On every supported Python: environment markers can install a different
    # package set per interpreter.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}

      - name: Sync every extra
        run: uv sync --locked --all-extras --no-dev --no-install-project

      - name: Check dependency licenses
        # shell: bash adds pipefail, so a pip-licenses failure fails the step.
        shell: bash
        run: >-
          uv run --no-sync --with pip-licenses==5.5.5
          pip-licenses --format=json
          | uv run --no-sync python .github/scripts/check_licenses.py

name: pin-freshness

# Weekly check of the pins Dependabot does not move (the data-plane base
# image and uv image digests, the apt pins, the ADOT collector sidecar, the
# AWS CDK CLI, the Trivy image): scripts/check_pins.py compares each with
# upstream. The data-plane image is also built and scanned with Trivy as the
# quality workflow's docker job scans it, so a fix released after the last
# pull request (a Debian security update the base digest lacks, say) is
# reported before the next pull request fails on it. When a pin is behind or
# the scan finds a fixable HIGH or CRITICAL vulnerability, the report goes
# into an open issue (one, updated each week until it is resolved).

on:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # open or update the report issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pins with upstream
        id: pins
        # Exit 1 = a pin is behind (reported below), 2 = a lookup failed
        # (fails the job, so a broken check does not pass silently).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check_pins.py --report "$RUNNER_TEMP/pins.md"
          status=$?
          set -e
          [ "$status" -le 1 ] || exit "$status"
          echo "behind=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/pins.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and scan the image
        id: scan
        # As the quality workflow's docker job, with its pinned Trivy image
        # (read from there, so there is one pin). Exit 1 from Trivy = a
        # fixable HIGH or CRITICAL finding (reported below); a build that
        # fails, or any other Trivy error, fails the job.
        run: |
          set -o pipefail
          # The docker job's fallback: after a public.ecr.aws 429, pull the
          # same pinned base digest from Docker Hub.
          base=$(sed -n 's|^ARG BASE_IMAGE=public\.ecr\.aws/docker/library/\(.*@sha256:[0-9a-f]\{64\}\)$|\1|p' docker/Dockerfile)
          [ -n "$base" ] || { echo "docker/Dockerfile: BASE_IMAGE is not a pinned public.ecr.aws/docker/library ref"; exit 1; }
          base_arg=()
          built=false
          for attempt in 1 2 3; do
            if docker build -f docker/Dockerfile "${base_arg[@]}" -t unified-kg-rag:weekly . 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              built=true
              break
            fi
            grep -qiE 'toomanyrequests|429 Too Many Requests' "$RUNNER_TEMP/build.log" || exit 1
            base_arg=(--build-arg "BASE_IMAGE=docker.io/library/$base")
            sleep $((attempt * 20))
          done
          [ "$built" = true ] || exit 1
          trivy=$(grep -oE 'aquasec/trivy:[0-9.]+@sha256:[0-9a-f]{64}' .github/workflows/quality.yml | sort -u)
          [ "$(printf '%s\n' "$trivy" | wc -l)" -eq 1 ] || { echo "quality.yml pins more than one Trivy image"; exit 1; }
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" \
            "$trivy" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --ignorefile /trivyignore.yaml --format table \
            unified-kg-rag:weekly > "$RUNNER_TEMP/scan.txt"
          status=$?
          set -e
          [ "$status" -le 1 ] || { cat "$RUNNER_TEMP/scan.txt"; exit "$status"; }
          echo "findings=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 1 ]; then
            {
              echo
              echo "The data-plane image has fixable HIGH or CRITICAL vulnerabilities (weekly Trivy scan):"
              echo
              echo '```'
              cat "$RUNNER_TEMP/scan.txt"
              echo '```'
              echo
              echo "Bump the pin that clears each (a base image digest, an apt pin in docker/Dockerfile, a lock bump; CONTRIBUTING.md, \"Pins Dependabot does not move\"), or accept it in .trivyignore.yaml with its reason and an expiry."
            } >> "$RUNNER_TEMP/pins.md"
            cat "$RUNNER_TEMP/scan.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the issue
        if: steps.pins.outputs.behind == 'true' || steps.scan.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Pinned images and tools are behind upstream"
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pins.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/pins.md"
          fi

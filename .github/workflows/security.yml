name: security

# Automated Security Helper (ASH) scan: bandit, semgrep, detect-secrets,
# checkov, cdk-nag and npm-audit. A gate: an unsuppressed finding at MEDIUM or
# above fails the job. The pip-audit job checks the locked Python
# dependencies against the advisory databases (ASH's own dependency scanners,
# grype and syft, cannot run here: .ash/.ash.yaml). The threshold, the path-scoped suppressions (each with
# its reason) and the scanners left out are in .ash/.ash.yaml; a suppression
# about one statement sits on that line (`# nosec`, `# nosemgrep`,
# `# pragma: allowlist secret`).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The scan only reads the checkout and uploads its reports as a workflow
# artifact (no SARIF upload to code scanning), so read access is enough.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Supersede stale PR runs only, as quality.yml does.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ash-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scanners run third-party code on the checkout and nothing here
          # pushes: keep the token out of .git/config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Run ASH
        # Pinned to the commit of tag v3.1.2: a tag can be moved, a SHA cannot.
        # Its own dependencies (the scanners among them) resolve as of the
        # --exclude-newer date, so a new scanner release cannot change a run
        # either; move the date when bumping ASH. Exits non-zero on an actionable finding (fail_on_findings in
        # .ash/.ash.yaml). semgrep runs the registry's `auto` rules, so a rule
        # published upstream can fail a run whose diff did not change: triage
        # it like any finding (fix, or suppress with the reason).
        run: >-
          uvx --exclude-newer 2026-11-01T00:00:00Z
          git+https://github.com/awslabs/automated-security-helper.git@e73de85c1db7f443276370c4a6f7501815756780
          --source-dir .

      - name: Findings in the job summary
        # ASH's own Markdown summary: the findings per scanner and severity,
        # and the files with the most. Written when the scan fails too.
        if: always()
        run: |
          summary=.ash/ash_output/reports/ash.summary.md
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ASH wrote no summary (see the Run ASH step log)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ASH reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-reports
          path: .ash/ash_output/reports/
          if-no-files-found: ignore

  pip-audit:
    # Every locked runtime dependency, of every extra (the dev group is not
    # shipped), against the PyPI vulnerability service (pip-audit's default;
    # PyPI serves the PyPA advisory database, which OSV mirrors). A known
    # vulnerability fails the job unless .github/pip-audit-accepted.txt lists
    # its id, until a date, with the reason it does not apply; past the date
    # it gates again. Nothing is installed: the exported lock is hashed, so
    # pip-audit resolves nothing itself.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Audit the locked dependencies
        # pip-audit and its own dependencies resolve as of the date, as ASH's
        # do; move it when bumping pip-audit.
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          ignores=()
          today=$(date -u +%F)
          while read -r id until _; do
            if [[ ! "$until" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::$id: no YYYY-MM-DD date after the id"
              exit 1
            elif [[ "$until" < "$today" ]]; then
              echo "::warning::$id was accepted until $until: it gates again"
            else
              ignores+=(--ignore-vuln "$id")
            fi
          done < <(grep -E '^[A-Z]+-[0-9A-Za-z-]+ ' .github/pip-audit-accepted.txt)
          uvx --exclude-newer 2026-11-01T00:00:00Z pip-audit==2.10.1 \
            --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip \
            --progress-spinner off "${ignores[@]}"

name: security

# Automated Security Helper (ASH) scan. Reports only, never blocks.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The scan only reads the checkout and uploads its reports as a workflow
# artifact (no SARIF upload to code scanning), so read access is enough.
permissions:
  contents: read

jobs:
  ash-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Run ASH
        # Pinned to the commit of tag v3.1.2: a tag can be moved, a SHA cannot.
        run: >-
          uvx git+https://github.com/awslabs/automated-security-helper.git@e73de85c1db7f443276370c4a6f7501815756780
          --source-dir . --no-fail-on-findings

      - name: Upload ASH reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-reports
          path: .ash/ash_output/reports/
          if-no-files-found: ignore

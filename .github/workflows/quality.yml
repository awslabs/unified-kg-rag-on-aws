name: quality

# Lint / format / import-order / type-check / tests + coverage.
# Mirrors the pre-commit gate; runs on PRs and pushes to the default branch.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Deterministic Hypothesis runs without per-example deadlines (tests/conftest.py).
  HYPOTHESIS_PROFILE: ci

concurrency:
  group: quality-${{ github.ref }}
  # Supersede stale PR runs only; every push to main runs to completion so each
  # merged commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  optional-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
      - name: Install patched optional parsers
        # eval brings langchain-community (ragas' copy), so the .md/.html
        # loaders are also compared side by side with the ones they replaced.
        run: uv sync --locked --extra unstructured --extra eval
      - name: Check the optional parsers are importable
        # The security test skips itself when unstructured is missing, and the
        # side-by-side loader comparison when langchain-community is, either
        # of which would let this job pass without testing anything.
        run: uv run --frozen python -c "import unstructured, langchain_community"
      - name: Check optional parsing, registration and private URL rejection
        # The parser-factory and loader tests take their unstructured-installed
        # branch (.md/.html registered, parsed and golden-checked) only in this
        # job.
        run: >-
          uv run --frozen pytest -q
          tests/unit/test_optional_parser_security.py
          tests/unit/test_parser_factory.py
          tests/unit/test_loader_logic.py
          tests/unit/test_file_loaders_golden.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Sync dependencies
        # --locked: fail if uv.lock is stale relative to pyproject.toml.
        run: uv sync --locked --extra otel --extra eval --extra viz --extra ontology --extra mcp --extra docx --extra console

      - name: Check the eval, viz, ontology, mcp, docx and console extras are importable
        # The tests that need them skip themselves without them
        # (tests/fixtures/extras.py), which would let this job pass without
        # running them.
        run: uv run --frozen python -c "import datasets, docx, langchain_openai, mcp, pandas, pyvis, ragas, rdflib, fastapi, uvicorn, multipart"

      - name: Ruff (lint)
        run: uv run ruff check unified_kg_rag tests iac scripts

      - name: Black (format check)
        run: uv run black --check unified_kg_rag tests iac scripts

      - name: isort (import order)
        run: uv run isort --check-only unified_kg_rag tests iac scripts

      - name: mypy (type check)
        run: uv run mypy unified_kg_rag

      - name: File hygiene hooks
        # The pre-commit hooks not covered by the steps above: end-of-file,
        # trailing whitespace, YAML syntax and merge-conflict markers.
        env:
          SKIP: ruff,isort,black,mypy
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: pytest + coverage
        # The `aws` marker gates tests needing real AWS services; the pyproject
        # addopts selector (not aws, perf or weekly) excludes them here.
        # This one run also covers the property and integration suites. Keep
        # the coverage floor just under the measured level so new untested
        # code cannot silently regress it; ratchet it up as coverage grows.
        # -n logical: one pytest-xdist worker per vCPU (`auto` counts physical
        # cores, half the runner's); pytest-cov combines the workers' coverage
        # before the floor is checked.
        env:
          # Python 3.12's sys.monitoring tracer: line coverage (the suite
          # measures no branches) at a fraction of the C tracer's cost.
          COVERAGE_CORE: sysmon
        run: >-
          uv run pytest -n logical
          --cov=unified_kg_rag --cov-report=term-missing
          --cov-report=xml:coverage.xml --junitxml=report.xml
          --cov-fail-under=95

      - name: Upload coverage + test report
        # Surface coverage.xml / report.xml as artifacts for inspection on each
        # run, and the raw data the coverage-combined job merges.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-and-report
          path: |
            coverage.xml
            report.xml
            .coverage
          include-hidden-files: true
          if-no-files-found: ignore

  core-install:
    # The default install has none of the eval, viz, ontology, mcp, console,
    # otel and cross-encoder extras: check the public API, every console
    # script in a process of its own, the embedded end-to-end runs (a JSONL
    # seed graph's too) and the static charts work without them, and that
    # run-eval, the interactive renderer, an owl schema source, an rdf seed
    # source, run-mcp-server and run-console fail naming the extra instead.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      # Without the dev group too: its langchain-openai is an eval module,
      # which would hide a judge that runs without the extra. The test group
      # is the test runner alone.
      - name: Sync without extras
        run: uv sync --locked --no-dev --group test

      - name: Check the extras are absent
        run: >-
          uv run --frozen --no-dev --group test python -c "import importlib.util as u, sys;
          present = [m for m in ('datasets', 'docx', 'fastapi', 'langchain',
          'langchain_community', 'langchain_openai', 'langgraph', 'mcp',
          'multipart', 'opentelemetry', 'pandas', 'pyvis', 'ragas', 'rdflib',
          'sentence_transformers', 'snowballstemmer', 'tiktoken', 'unstructured',
          'uvicorn')
          if u.find_spec(m)]; sys.exit(f'installed: {present}' if present else 0)"

      - name: Public API, extra errors and embedded end to end
        run: >-
          uv run --frozen --no-dev --group test pytest -q -n auto
          tests/unit/test_public_api.py
          tests/unit/test_evaluation_manager.py
          tests/unit/test_visualization_cli.py
          tests/unit/test_static_renderer.py
          tests/unit/test_layering.py
          tests/unit/test_mcp_server_cli.py
          tests/unit/test_mcp_tools.py
          tests/unit/test_run_console.py
          tests/unit/test_owl_schema_source.py
          tests/unit/test_seed_sources.py
          tests/unit/test_rdf_seed_source.py
          tests/integration/test_cli_entry_points.py
          tests/integration/test_embedded_e2e.py
          tests/integration/test_seed_graph_embedded.py
          tests/integration/test_seed_properties_embedded.py

  local-stores:
    # The container backend of the store conformance suites, the SQLite vs
    # OpenSearch parity test and tests/integration/test_local_stores.py are
    # skipped unless LOCAL_STORES=1, so the quality job never runs the
    # graph/vector adapters against a real Gremlin Server and OpenSearch (with
    # nori). Start the dev compose stack (no AWS, hashing embeddings) and run
    # them here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Start Gremlin Server and OpenSearch
        # Docker Hub rate-limits and drops anonymous pulls (including the
        # OpenSearch build's base image); retry so a transient registry error
        # does not fail the job.
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose -f docker/compose.local.yaml up -d --wait && exit 0
            docker compose -f docker/compose.local.yaml down --remove-orphans || true
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Sync dependencies
        run: uv sync --locked

      # Coverage too: the Neptune and OpenSearch adapters run against real
      # stores only here, so the coverage-combined job adds this data to the
      # quality job's.
      - name: Adapter smoke test against the local stores
        env:
          LOCAL_STORES: "1"
          COVERAGE_CORE: sysmon
        run: >-
          uv run pytest tests/integration/test_local_stores.py
          --cov=unified_kg_rag --cov-report=

      - name: Store conformance and parity against the local stores
        env:
          LOCAL_STORES: "1"
          COVERAGE_CORE: sysmon
        run: >-
          uv run pytest tests/integration/test_*conformance*.py
          tests/integration/test_store_parity.py
          tests/integration/test_neptune_vertex_ids.py
          tests/integration/test_opensearch_vector_storage.py
          tests/integration/test_embedded_schema_e2e.py
          --cov=unified_kg_rag --cov-append --cov-report=

      # The end-to-end ingest, incremental run and strategy loop of the
      # embedded suite, on Gremlin Server and OpenSearch (its sqlite case
      # runs in the quality job).
      - name: End to end against the local stores
        env:
          LOCAL_STORES: "1"
          COVERAGE_CORE: sysmon
        run: >-
          uv run pytest tests/integration/test_embedded_e2e.py
          -k "each_store_backend and container"
          --cov=unified_kg_rag --cov-append --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-local-stores
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

      - name: Store logs
        if: failure()
        run: docker compose -f docker/compose.local.yaml logs

      - name: Stop the stores
        if: always()
        run: docker compose -f docker/compose.local.yaml down -v

  coverage-combined:
    # The quality job's coverage plus the local-stores job's, as one report
    # in the job summary. Informational only: the floor stays on the quality
    # job's own report.
    needs: [quality, local-stores]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Sync the dev tools
        # coverage as the lock pins it (pytest-cov's, in the dev group); the
        # report reads [tool.coverage] from the checkout.
        run: uv sync --locked --only-dev

      - name: Download the coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-data

      - name: Combine and report
        # Both jobs ran from the same checkout path, so no path remapping.
        run: |
          uv run --frozen --no-sync coverage combine --keep \
            coverage-data/coverage-and-report/.coverage \
            coverage-data/coverage-local-stores/.coverage
          total=$(uv run --frozen --no-sync coverage report --format=total --precision=2)
          echo "Combined line coverage (quality + local-stores): ${total}%"
          {
            echo "### Combined line coverage (quality + local-stores): ${total}%"
            echo
            uv run --frozen --no-sync coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"

  oldest-python:
    # The quality job runs one interpreter, so nothing else checks the LOWER
    # bound of requires-python. Run the suite on the floor to keep it honest.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.11"

      - name: Sync dependencies
        # --frozen: resolve nothing, install exactly what the committed lock
        # pins, so this also proves the lock itself is installable on the floor.
        # The extras the quality job installs, so the mcp, docx and console
        # tests run on the floor too instead of skipping.
        run: uv sync --python 3.11 --frozen --extra otel --extra eval --extra viz --extra ontology --extra mcp --extra docx --extra console

      - name: pytest
        run: uv run --python 3.11 --frozen pytest -q -n logical

  python-3-13:
    # Early warning for the next interpreter, not a support claim:
    # requires-python stops below 3.13, so this job lifts the cap in its own
    # checkout and re-locks (the lock keeps its versions and only gains their
    # 3.13 wheels) before running the suite. Non-blocking until 3.13 is
    # supported for real.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.13"

      - name: Allow Python 3.13 in this checkout
        run: |
          sed -i 's/^requires-python = ">=3.11, <3.13"$/requires-python = ">=3.11, <3.14"/' pyproject.toml
          grep -q '^requires-python = ">=3.11, <3.14"$' pyproject.toml
          uv lock

      - name: Sync dependencies
        run: uv sync --python 3.13 --frozen --extra otel --extra eval --extra viz --extra ontology

      - name: pytest
        run: uv run --python 3.13 --frozen pytest -q -n logical

  console-web:
    # The console's web client: the lockfile installs, it type-checks, lints,
    # passes its unit tests (every locale checked against the English
    # catalog) and builds. The Python side runs in the quality job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install (lockfile)
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=moderate

  console-smoke:
    # One browser pass through the console on the demo workspace with the
    # fake models (no AWS, no model): on pushes to main, and on every pull
    # request but one that changes only docs/, iac/ or Markdown files (it
    # installs a browser; the console reads the chain, the config, the
    # evaluation and inspection results, so a list of the files it reads
    # missed some).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UKR_CONSOLE_TOKEN: ci-smoke-token-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Does the change reach beyond docs and IaC?
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "console=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" | grep -qvE '^(docs/|iac/)|\.md$'; then
            echo "console=true" >> "$GITHUB_OUTPUT"
          else
            echo "console=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        if: steps.changes.outputs.console == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.console == 'true'
        with:
          node-version: "24"
      - name: Install
        if: steps.changes.outputs.console == 'true'
        run: |
          uv sync --locked --extra console
          cd console/web && npm ci --no-audit --no-fund && npm run build
          npx playwright install --with-deps chromium
      - name: Start the demo console
        if: steps.changes.outputs.console == 'true'
        run: |
          uv run --frozen python console/demo/demo.py --models fake --workspace "$RUNNER_TEMP/demo" --port 8501 > "$RUNNER_TEMP/demo.log" 2>&1 &
          for _ in $(seq 120); do curl -fs -H "X-Console-Token: $UKR_CONSOLE_TOKEN" http://127.0.0.1:8501/api/status > /dev/null && break; sleep 1; done
          curl -fs -H "X-Console-Token: $UKR_CONSOLE_TOKEN" http://127.0.0.1:8501/api/status
      - name: Smoke test
        if: steps.changes.outputs.console == 'true'
        working-directory: console/web
        env:
          CONSOLE_URL: http://127.0.0.1:8501/?token=${{ env.UKR_CONSOLE_TOKEN }}
        run: npm run test:smoke
      - name: Demo log
        if: failure()
        run: cat "$RUNNER_TEMP/demo.log"

  iac:
    # Synthesize the CDK app with cdk-nag enabled so the Well-Architected
    # posture (and the curated nag_suppressions) is enforced in CI — an
    # over-broad policy or public exposure introduced later fails here instead
    # of shipping silently. IMPORTANT: cdk-nag violations exit non-zero only via
    # the `cdk` CLI (`cdk synth`); a plain `python app.py` does NOT fail on them,
    # so this job must use the CLI for the gate to have teeth.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1146.1

      - name: Install IaC dependencies
        # iac/ is its own uv project, outside the root lock; --locked fails if
        # iac/uv.lock is stale relative to iac/pyproject.toml.
        run: uv sync --locked --project iac

      - name: cdk synth with cdk-nag (fails on any unsuppressed finding)
        working-directory: iac
        run: uv run --no-sync cdk synth -c enable_cdk_nag=true -q

      - name: cdk synth with cdk-nag, production-hardened flags
        # The README's zero-findings claim covers the hardened shape too: CMK,
        # flow logs, Multi-AZ Neptune, zone-aware OpenSearch (no OS4/OS7
        # suppression applies when opensearch_count > 1), retained storage.
        working-directory: iac
        run: >-
          uv run --no-sync cdk synth -q
          -c enable_cdk_nag=true
          -c use_cmk=true
          -c vpc_flow_logs=true
          -c neptune_instances=2
          -c opensearch_count=2
          -c deletion_protection=true
          -c removal_destroy=false

      - name: IaC assertion tests
        working-directory: iac
        run: uv run --no-sync pytest -q

  docker:
    # Build the data-plane image (no push) so a Dockerfile that no longer builds,
    # e.g. an apt pin dropped from the Debian repo or a lock the image cannot
    # install, fails here instead of at deploy time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        # The base image pulls from public.ecr.aws, whose anonymous data quota
        # (429 toomanyrequests) does not recover within minutes. After the
        # first 429, pull the same pinned digest from Docker Hub instead (same
        # bytes, different registry); retry only 429s, so a broken Dockerfile
        # fails at once.
        run: |
          set -o pipefail
          # Docker Hub's library/ repos mirror public.ecr.aws/docker/library/,
          # so the fallback is the Dockerfile's own ref with the registry swapped.
          base=$(sed -n 's|^ARG BASE_IMAGE=public\.ecr\.aws/docker/library/\(.*@sha256:[0-9a-f]\{64\}\)$|\1|p' docker/Dockerfile)
          [ -n "$base" ] || { echo "docker/Dockerfile: BASE_IMAGE is not a pinned public.ecr.aws/docker/library ref"; exit 1; }
          base_arg=()
          for attempt in 1 2 3 4 5; do
            if docker build -f docker/Dockerfile "${base_arg[@]}" -t unified-kg-rag:ci . 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              exit 0
            fi
            grep -qiE 'toomanyrequests|429 Too Many Requests' "$RUNNER_TEMP/build.log" || exit 1
            base_arg=(--build-arg "BASE_IMAGE=docker.io/library/$base")
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Run the image
        # The default command (run-ingestion --help) goes through the
        # entrypoint and the installed console script, so a missing runtime
        # dependency or a broken entrypoint fails here, not at deploy time.
        run: docker run --rm unified-kg-rag:ci

      - name: Check the image leaves the eval extra out
        # run-eval's default evaluators are LLM-free; the ragas judge's eval
        # extra (about 390 MB) is opt-in (UV_EXTRAS, the docker-unstructured
        # job builds it), and run-eval names it when a run selects ragas.
        run: >-
          docker run --rm unified-kg-rag:ci python -c
          "import importlib.util as u, sys;
          present = [m for m in ('ragas', 'datasets', 'pandas', 'langchain_community') if u.find_spec(m)];
          sys.exit(f'eval extra installed: {present}' if present else 0)"

      - name: Check the runtime image layout
        # No uv and no AWS CLI (the corpus sync is docker/s3_sync.py); the
        # app user cannot write the venv, only its own directories.
        run: >-
          docker run --rm unified-kg-rag:ci sh -c
          '! command -v uv && ! command -v aws
          && ! touch /app/.venv/probe 2>/dev/null
          && touch /app/cache/probe /app/outputs/probe /app/logs/probe
          && python /usr/local/lib/unified-kg-rag/s3_sync.py --help > /dev/null'

      - name: Scan the image for fixable vulnerabilities
        # Trivy over the image just built: fails on a HIGH or CRITICAL finding
        # that has a fix, which a base-image digest or a lock bump clears
        # (.trivyignore.yaml lists the accepted ones, each with its reason and
        # expiry). The image is pinned by digest and run directly, not through
        # trivy-action, whose tags were hijacked in March 2026 (GHSA-69fq-xp46-6x23);
        # 0.76.1 is a release after it. The vulnerability database is
        # downloaded at run time.
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro"
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --ignorefile /trivyignore.yaml unified-kg-rag:ci

  docker-unstructured:
    # The image with the opt-in extras: unstructured (Markdown and HTML),
    # which also bakes in the spaCy model unstructured tokenizes with (a
    # private VPC cannot download it at the first file), and eval (run-eval's
    # ragas judge). Built only (no push), with the same rate-limit fallback as
    # the docker job.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image with the unstructured and eval extras
        run: |
          set -o pipefail
          base=$(sed -n 's|^ARG BASE_IMAGE=public\.ecr\.aws/docker/library/\(.*@sha256:[0-9a-f]\{64\}\)$|\1|p' docker/Dockerfile)
          [ -n "$base" ] || { echo "docker/Dockerfile: BASE_IMAGE is not a pinned public.ecr.aws/docker/library ref"; exit 1; }
          base_arg=()
          for attempt in 1 2 3 4 5; do
            if docker build -f docker/Dockerfile "${base_arg[@]}" \
                --build-arg "UV_EXTRAS=--extra unstructured --extra eval" \
                -t unified-kg-rag:ci-unstructured . 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              exit 0
            fi
            grep -qiE 'toomanyrequests|429 Too Many Requests' "$RUNNER_TEMP/build.log" || exit 1
            base_arg=(--build-arg "BASE_IMAGE=docker.io/library/$base")
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Check the image has the spaCy model
        # Offline, as a private task runs: the model must load from the image.
        run: >-
          docker run --rm --network none unified-kg-rag:ci-unstructured
          python -c "import en_core_web_sm; en_core_web_sm.load()"

      - name: Check the image has the eval extra
        run: docker run --rm unified-kg-rag:ci-unstructured python -c "import datasets, langchain_openai, pandas, ragas"

      - name: Scan the image for fixable vulnerabilities
        # As in the docker job, over the extras' packages.
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro"
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --ignorefile /trivyignore.yaml unified-kg-rag:ci-unstructured

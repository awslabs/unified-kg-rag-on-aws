name: quality

# Lint / format / import-order / type-check / tests + coverage.
# Mirrors the pre-commit gate; runs on PRs and pushes to the default branch.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Deterministic Hypothesis runs without per-example deadlines (tests/conftest.py).
  HYPOTHESIS_PROFILE: ci

concurrency:
  group: quality-${{ github.ref }}
  # Supersede stale PR runs only; every push to main runs to completion so each
  # merged commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  optional-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install patched optional parsers
        run: uv sync --locked --extra unstructured
      - name: Check optional parsing and private URL rejection
        run: uv run --frozen pytest tests/unit/test_optional_parser_security.py -q

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Sync dependencies
        # --locked: fail if uv.lock is stale relative to pyproject.toml.
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check unified_kg_rag tests iac

      - name: Black (format check)
        run: uv run black --check unified_kg_rag tests iac

      - name: isort (import order)
        run: uv run isort --check-only unified_kg_rag tests iac

      - name: mypy (type check)
        run: uv run mypy unified_kg_rag

      - name: pytest + coverage
        # The `aws` marker gates tests needing real AWS services; excluded in CI.
        # This one run also covers the property and integration suites. The
        # coverage floor sits just under the measured level (~90%) so new
        # untested code cannot silently regress it; ratchet it up as it grows.
        run: >-
          uv run pytest -m "not aws"
          --cov=unified_kg_rag --cov-report=term-missing
          --cov-report=xml:coverage.xml --junitxml=report.xml
          --cov-fail-under=88

      - name: Upload coverage + test report
        # Surface coverage.xml / report.xml as artifacts for inspection on each run.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-and-report
          path: |
            coverage.xml
            report.xml
          if-no-files-found: ignore

  local-stores:
    # tests/integration/test_local_stores.py is skipped unless LOCAL_STORES=1,
    # so the quality job never runs the graph/vector adapters against a real
    # Gremlin Server and OpenSearch (with nori). Start the dev compose stack
    # (no AWS, hashing embeddings) and run that smoke test here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Start Gremlin Server and OpenSearch
        run: docker compose -f docker/compose.local.yaml up -d --wait

      - name: Sync dependencies
        run: uv sync --locked

      - name: Adapter smoke test against the local stores
        env:
          LOCAL_STORES: "1"
        run: uv run pytest tests/integration/test_local_stores.py

      - name: Store logs
        if: failure()
        run: docker compose -f docker/compose.local.yaml logs

      - name: Stop the stores
        if: always()
        run: docker compose -f docker/compose.local.yaml down -v

  oldest-python:
    # The quality job runs one interpreter, so nothing checked the LOWER bound of
    # requires-python. It was broken: html_exporter imported `datetime.UTC`, which
    # is 3.11+, so every install on the declared minimum failed at import. Run the
    # suite on the floor to keep that bound honest.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"

      - name: Sync dependencies
        # --frozen: resolve nothing, install exactly what the committed lock
        # pins, so this also proves the lock itself is installable on the floor.
        run: uv sync --python 3.10 --frozen

      - name: pytest
        run: uv run --python 3.10 --frozen pytest -m "not aws" -q

  iac:
    # Synthesize the CDK app with cdk-nag enabled so the Well-Architected
    # posture (and the curated nag_suppressions) is enforced in CI — an
    # over-broad policy or public exposure introduced later fails here instead
    # of shipping silently. IMPORTANT: cdk-nag violations exit non-zero only via
    # the `cdk` CLI (`cdk synth`); a plain `python app.py` does NOT fail on them,
    # so this job must use the CLI for the gate to have teeth.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iac/requirements-lock.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "20"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1143.0

      - name: Install IaC dependencies
        # requirements.txt declares the ranges; requirements-lock.txt pins the
        # resolution so a new upstream release cannot change CI between runs.
        # Regenerate after editing the ranges:
        #   uv pip compile iac/requirements.txt --python-version 3.12 \
        #     --python-platform x86_64-unknown-linux-gnu -o iac/requirements-lock.txt
        run: >-
          pip install -r iac/requirements.txt -c iac/requirements-lock.txt
          pytest==9.1.1

      - name: cdk synth with cdk-nag (fails on any unsuppressed finding)
        working-directory: iac
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: cdk synth --all -c enable_cdk_nag=true -q

      - name: cdk synth with cdk-nag, production-hardened flags
        # The README's zero-findings claim covers the hardened shape too: CMK,
        # flow logs, Multi-AZ Neptune, zone-aware OpenSearch (no OS4/OS7
        # suppression applies when opensearch_count > 1), retained storage.
        working-directory: iac
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          cdk synth --all -q
          -c enable_cdk_nag=true
          -c use_cmk=true
          -c vpc_flow_logs=true
          -c neptune_instances=2
          -c opensearch_count=2
          -c deletion_protection=true
          -c removal_destroy=false

      - name: IaC assertion tests
        working-directory: iac
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests -q

  docker:
    # Build the data-plane image (no push) so a Dockerfile that no longer builds,
    # e.g. an apt pin dropped from the Debian repo or a lock the image cannot
    # install, fails here instead of at deploy time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build the image
        run: docker build -f docker/Dockerfile -t unified-kg-rag:ci .

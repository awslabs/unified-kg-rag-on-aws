name: quality

# Lint / format / import-order / type-check / tests + coverage.
# Mirrors the pre-commit gate; runs on PRs and pushes to the default branch.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Deterministic Hypothesis runs without per-example deadlines (tests/conftest.py).
  HYPOTHESIS_PROFILE: ci

concurrency:
  group: quality-${{ github.ref }}
  # Supersede stale PR runs only; every push to main runs to completion so each
  # merged commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  optional-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
      - name: Install patched optional parsers
        run: uv sync --locked --extra unstructured
      - name: Check the optional parsers are importable
        # The security test skips itself when unstructured is missing, which
        # would let this job pass without testing anything.
        run: uv run --frozen python -c "import unstructured"
      - name: Check optional parsing, registration and private URL rejection
        # The parser-factory and loader tests take their unstructured-installed
        # branch (.md/.html registered and parsed) only in this job.
        run: >-
          uv run --frozen pytest -q
          tests/unit/test_optional_parser_security.py
          tests/unit/test_parser_factory.py
          tests/unit/test_loader_logic.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Sync dependencies
        # --locked: fail if uv.lock is stale relative to pyproject.toml.
        run: uv sync --locked --extra otel

      - name: Ruff (lint)
        run: uv run ruff check unified_kg_rag tests iac scripts

      - name: Black (format check)
        run: uv run black --check unified_kg_rag tests iac scripts

      - name: isort (import order)
        run: uv run isort --check-only unified_kg_rag tests iac scripts

      - name: mypy (type check)
        run: uv run mypy unified_kg_rag

      - name: File hygiene hooks
        # The pre-commit hooks not covered by the steps above: end-of-file,
        # trailing whitespace, YAML syntax and merge-conflict markers.
        env:
          SKIP: ruff,isort,black,mypy
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: pytest + coverage
        # The `aws` marker gates tests needing real AWS services; excluded in CI.
        # This one run also covers the property and integration suites. Keep
        # the coverage floor just under the measured level so new untested
        # code cannot silently regress it; ratchet it up as coverage grows.
        run: >-
          uv run pytest -m "not aws"
          --cov=unified_kg_rag --cov-report=term-missing
          --cov-report=xml:coverage.xml --junitxml=report.xml
          --cov-fail-under=95

      - name: Upload coverage + test report
        # Surface coverage.xml / report.xml as artifacts for inspection on each run.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-and-report
          path: |
            coverage.xml
            report.xml
          if-no-files-found: ignore

  local-stores:
    # The container backend of the store conformance suites, the SQLite vs
    # OpenSearch parity test and tests/integration/test_local_stores.py are
    # skipped unless LOCAL_STORES=1, so the quality job never runs the
    # graph/vector adapters against a real Gremlin Server and OpenSearch (with
    # nori). Start the dev compose stack (no AWS, hashing embeddings) and run
    # them here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Start Gremlin Server and OpenSearch
        # Docker Hub rate-limits and drops anonymous pulls (including the
        # OpenSearch build's base image); retry so a transient registry error
        # does not fail the job.
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose -f docker/compose.local.yaml up -d --wait && exit 0
            docker compose -f docker/compose.local.yaml down --remove-orphans || true
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Sync dependencies
        run: uv sync --locked

      - name: Adapter smoke test against the local stores
        env:
          LOCAL_STORES: "1"
        run: uv run pytest tests/integration/test_local_stores.py

      - name: Store conformance and parity against the local stores
        env:
          LOCAL_STORES: "1"
        run: >-
          uv run pytest tests/integration/test_*conformance*.py
          tests/integration/test_store_parity.py

      - name: Store logs
        if: failure()
        run: docker compose -f docker/compose.local.yaml logs

      - name: Stop the stores
        if: always()
        run: docker compose -f docker/compose.local.yaml down -v

  oldest-python:
    # The quality job runs one interpreter, so nothing else checks the LOWER
    # bound of requires-python. Run the suite on the floor to keep it honest.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.11"

      - name: Sync dependencies
        # --frozen: resolve nothing, install exactly what the committed lock
        # pins, so this also proves the lock itself is installable on the floor.
        run: uv sync --python 3.11 --frozen

      - name: pytest
        run: uv run --python 3.11 --frozen pytest -m "not aws" -q

  iac:
    # Synthesize the CDK app with cdk-nag enabled so the Well-Architected
    # posture (and the curated nag_suppressions) is enforced in CI — an
    # over-broad policy or public exposure introduced later fails here instead
    # of shipping silently. IMPORTANT: cdk-nag violations exit non-zero only via
    # the `cdk` CLI (`cdk synth`); a plain `python app.py` does NOT fail on them,
    # so this job must use the CLI for the gate to have teeth.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1146.1

      - name: Install IaC dependencies
        # iac/ is its own uv project, outside the root lock; --locked fails if
        # iac/uv.lock is stale relative to iac/pyproject.toml.
        run: uv sync --locked --project iac

      - name: cdk synth with cdk-nag (fails on any unsuppressed finding)
        working-directory: iac
        run: uv run --no-sync cdk synth -c enable_cdk_nag=true -q

      - name: cdk synth with cdk-nag, production-hardened flags
        # The README's zero-findings claim covers the hardened shape too: CMK,
        # flow logs, Multi-AZ Neptune, zone-aware OpenSearch (no OS4/OS7
        # suppression applies when opensearch_count > 1), retained storage.
        working-directory: iac
        run: >-
          uv run --no-sync cdk synth -q
          -c enable_cdk_nag=true
          -c use_cmk=true
          -c vpc_flow_logs=true
          -c neptune_instances=2
          -c opensearch_count=2
          -c deletion_protection=true
          -c removal_destroy=false

      - name: IaC assertion tests
        working-directory: iac
        run: uv run --no-sync pytest -q

  docker:
    # Build the data-plane image (no push) so a Dockerfile that no longer builds,
    # e.g. an apt pin dropped from the Debian repo or a lock the image cannot
    # install, fails here instead of at deploy time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        # The base image pulls from public.ecr.aws, whose anonymous data quota
        # (429 toomanyrequests) does not recover within minutes. After the
        # first 429, pull the same pinned digest from Docker Hub instead (same
        # bytes, different registry); retry only 429s, so a broken Dockerfile
        # fails at once.
        run: |
          set -o pipefail
          # Docker Hub's library/ repos mirror public.ecr.aws/docker/library/,
          # so the fallback is the Dockerfile's own ref with the registry swapped.
          base=$(sed -n 's|^ARG BASE_IMAGE=public\.ecr\.aws/docker/library/\(.*@sha256:[0-9a-f]\{64\}\)$|\1|p' docker/Dockerfile)
          [ -n "$base" ] || { echo "docker/Dockerfile: BASE_IMAGE is not a pinned public.ecr.aws/docker/library ref"; exit 1; }
          base_arg=()
          for attempt in 1 2 3 4 5; do
            if docker build -f docker/Dockerfile "${base_arg[@]}" -t unified-kg-rag:ci . 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              exit 0
            fi
            grep -qiE 'toomanyrequests|429 Too Many Requests' "$RUNNER_TEMP/build.log" || exit 1
            base_arg=(--build-arg "BASE_IMAGE=docker.io/library/$base")
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Run the image
        # The default command (run-ingestion --help) goes through the
        # entrypoint and the installed console script, so a missing runtime
        # dependency or a broken entrypoint fails here, not at deploy time.
        run: docker run --rm unified-kg-rag:ci

# Unified Knowledge Graph RAG on AWS: configuration starting file.
#
# Copy it to config.yaml, set the store endpoints and keep only the keys you
# change. It lists the keys most deployments set, at their defaults. Every
# other key, with its type, default and description, is in
# docs/configuration.md (generated from the code); how the configuration
# loads (the backend preset, UKR__<SECTION>__<KEY> environment variables,
# CLI flags) is in docs/user-guide.md section 2.

# Provider preset. "aws": Bedrock, Neptune, OpenSearch and DynamoDB. "local":
# Ollama models, a cross-encoder reranker and embedded SQLite stores, filled
# in for every providers, models, aws.neptune and aws.opensearch key this file
# leaves unset. That is why those keys are commented out below: uncomment one
# only to change it.
backend: "aws"

# The provider of each role (defaults shown).
# providers:
#   llm:
#     kind: "bedrock"  # bedrock | openai_compatible | ollama
#     # Non-Bedrock server, e.g. http://localhost:11434 for Ollama or
#     # http://localhost:8000/v1 for an OpenAI-compatible one.
#     base_url: null
#   embedding:
#     kind: "bedrock"  # bedrock | openai_compatible | ollama
#     base_url: null
#   rerank:
#     kind: "bedrock"  # bedrock | cross_encoder | none
#   graph:
#     kind: "neptune"  # neptune | gremlin | sqlite (embedded, no server)
#   vector:
#     kind: "opensearch"  # opensearch | sqlite (embedded, no server)
#   doc_status:
#     kind: "dynamodb"  # dynamodb | sqlite
#     # Incremental indexing: each run diffs the corpus by content hash
#     # against this registry and re-indexes only new and changed documents.
#     enabled: false

# Which model serves each role. Any Bedrock model or inference-profile id
# works for the language models; another provider needs its own ids.
models:
  # Extraction, gleaning, claims, community reports and answers.
  # null = anthropic.claude-sonnet-5-5 on Bedrock.
  default: null
  # Chunking, translation, summaries, routing and global/DRIFT steps.
  # null = anthropic.claude-haiku-5-5 on Bedrock.
  fast: null
  # Per-role overrides: a model id or a tier name, for example
  # {answer_generation: "anthropic.claude-opus-5-5", query_rewrite: default}.
  roles: {}
  # null = amazon.titan-embed-text-v2:0 at its largest dimension. Both are
  # fixed into the index mappings: changing either needs a full re-index.
  embedding:
    model_id: null
    dimension: null
  rerank: null  # null = cohere.rerank-v3-5:0 on Bedrock

aws:
  region_name: "us-west-2"
  profile_name: null
  bedrock:
    # null = aws.region_name. A private VPC whose only Bedrock route is its
    # VPC endpoint must keep its own region.
    region_name: null
    # Bedrock models only (a set value is ignored, with a warning, under
    # other providers).
    # default_effort: "high"
    # fast_effort: "low"
    # Effort of the default-tier ingestion calls; e.g. "medium" cuts the
    # ingestion cost without changing queries. null = default_effort.
    # ingestion_effort: null
    # Amazon Bedrock Guardrails: screens each user query and each answer.
    guardrail:
      identifier: null  # guardrail ID or ARN; null = no guardrail
      version: "DRAFT"
  neptune:
    endpoint:  # your Neptune cluster endpoint
    # port: 8182
    # use_iam: true
    # use_ssl: true
  opensearch:
    endpoint:  # your OpenSearch domain endpoint
    # port: 443
    # use_ssl: true
    # use_iam: false
  s3:
    bucket_name:  # only for run-ingestion --s3-sync (stage-cache sync)
  dynamodb:
    # The incremental-indexing registry (providers.doc_status).
    table_name: "unified-kg-rag-on-aws-doc-status-v2"

processing:
  # LLM calls a stage keeps in flight; lower it if the logs show
  # ThrottlingException retries (backend "local" sets 20).
  # max_concurrency: 40
  chunking:
    chunker_type: "intelligent"  # intelligent (LLM-guided) | simple
    length_unit: "chars"  # chars | tokens (a local estimate, e.g. for CJK)
    min_chunk_size: 1000
    max_chunk_size: 8000
    chunk_overlap: 500
  translation:
    # Translation runs only when the languages differ.
    source_language: "en"
    target_language: "en"
  gleaning:
    enabled: true
    max_rounds: 3
  claim_extraction:
    enabled: false

indexing:
  # true for one run: rebuild the index namespace from the whole corpus
  # (with the registry on) instead of applying a delta.
  reset: false
  opensearch:
    # Text analyzer per language; nori needs the analysis-nori plugin.
    language_analyzers:
      en: "english"
      ko: "nori"

search:
  # The strategies the "auto" router chooses from.
  auto_routable_strategies: ["local", "mix", "global"]
  reranking:
    enabled: true
    top_k: 100
  # token_manager:
  #   # Context tokens for the answer (backend "local" sets what its model fits).
  #   max_context_tokens: 30000

logging:
  level: "INFO"

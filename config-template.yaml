# Unified Knowledge Graph RAG on AWS: configuration starting file.
# Copy it to config.yaml and keep only the keys you change. Every key, its
# type, default and description: docs/configuration.md (generated from the
# code). How the configuration is loaded: docs/user-guide.md section 2.

# AWS Configuration
aws:
  region_name: "us-west-2"
  profile_name: null

  # Bedrock Configuration
  bedrock:
    # null = aws.region_name. Set it only when your models are enabled in
    # another region; a private VPC whose only Bedrock route is its VPC
    # endpoint must keep its own region. Rerank models are not offered in
    # every region (e.g. not in ap-northeast-2).
    region_name: null
    assumed_role_arn: null
    enable_global_profile: true
    # max_tokens per LLM request, clamped to the model maximum. Bedrock reserves
    # input + max_tokens against the tokens-per-minute quota at request start,
    # so asking for the model maximum (128K on Claude 5.x) throttles concurrent
    # calls early. Thinking tokens count toward it. Long-output prompts declare
    # a higher floor that wins (graph/claim extraction, gleaning and community
    # reports 32K, document translation 64K). null sends the model maximum.
    default_max_output_tokens: 16384
    # Capability overrides for a language model without a curated record (or to
    # correct one); embedding and rerank ids are a closed list instead. Unlisted models get provider-family defaults ('anthropic.claude-*',
    # 'openai.gpt-*') or, for other providers, conservative ones (Converse, no
    # reasoning/sampling params, 32K window, 4K output) with one warning.
    # Keys: context_window_size, max_output_tokens, supports_thinking,
    # supports_sampling_params, supports_prompt_caching, supports_count_tokens,
    # supports_streaming, adaptive_thinking_only, requires_inference_profile, ...
    model_overrides: {}
    #   "amazon.nova-pro-v1:0":
    #     context_window_size: 300000
    #     max_output_tokens: 10000
    # Opt into the 1M-token context window on models that offer it as a beta
    # (Sonnet 4/4.5, Opus 4/4.1/4.5). Off by default — long-context requests are
    # billed at a premium there. Claude 5 has a native 1M window and ignores
    # this. Turning it on also widens the derived retrieval context budget.
    enable_1m_context: false
    # Reasoning effort, per model tier. Sent as output_config.effort to
    # Anthropic adaptive-thinking models (Claude 4.6 and later), which replaced
    # the fixed thinking token budget, and as reasoning.effort to OpenAI GPT
    # models. One of: low, medium, high, xhigh, max. Lower levels trade
    # reasoning depth for cost and latency; xhigh/max are only accepted by some
    # models (e.g. Claude 4.6 has no xhigh) and an unsupported level fails fast.
    # Ignored by older Claude models, which still use thinking_budget_tokens.
    # A call's tier follows its model id: a call on the fast tier's model (when
    # it differs from the default tier's) uses fast_effort, every other call uses
    # default_effort. The shipped fast model (Claude Haiku 5.5) thinks
    # adaptively, so fast_effort sets how much it reasons on fast-tier calls.
    default_effort: "high"
    fast_effort: "low"
    # Effort for ingestion calls on the default tier (graph extraction,
    # gleaning, claim extraction, community reports; the output fixer only
    # when models.roles.fixing is a default-tier model), which use most of an ingestion's default-tier tokens. null inherits
    # default_effort; set e.g. "medium" to cut ingestion cost without changing
    # query-time effort. Fast-tier ingestion calls keep fast_effort.
    ingestion_effort: null
    # Amazon Bedrock Guardrails (WAF security pillar). Disabled unless an
    # identifier is set. The query chain then screens texts with the
    # ApplyGuardrail API: the raw user query once, before memory, rewrite,
    # routing and retrieval (prompt attacks, denied topics, PII), and the final
    # answer once. A blocked query gets the guardrail's blocked message and is
    # never retrieved (RAGOutput.metadata.blocked); a masked query (PII
    # anonymized) continues with the masked text. The query chain's own model
    # calls are not guarded: their prompts carry corpus text and instructions,
    # which a guardrail would judge as user input. Interventions are logged at
    # WARNING and listed in RAGOutput.metadata.guardrail.
    guardrail:
      identifier: null # Guardrail ID or ARN, e.g. "abcd1234efgh"
      version: "DRAFT" # "DRAFT" or a published version number
      # Return full assessments (also non-detected entries) for auditing.
      trace: false
      check_input: true # screen each raw user query (source INPUT)
      # Screen each final answer (source OUTPUT). A streamed answer is then
      # generated in full, screened, and delivered as one chunk.
      check_output: true
    # Retry on transient Bedrock errors that botocore does not retry, such as
    # HTTP 424 ModelErrorException. Applies to every embedding request and to
    # query-time LLM calls (strategy routing, query entity/keyword extraction,
    # translation, query rewrite, answer generation, global/DRIFT steps).
    # Validation/access errors still fail fast. Ingestion LLM calls are
    # retried by their batch processor instead (processing.max_attempts).
    transient_retry:
      max_attempts: 5  # total attempts per call; 1 disables the retry
      base_delay_seconds: 2.0  # first backoff ceiling; doubles with jitter
      max_delay_seconds: 16.0
      max_total_seconds: 60.0  # wall-clock retry budget per call

  # Neptune Configuration
  neptune:
    endpoint: # Add endpoint here
    # The connection keys below are commented out so that `backend: local` can
    # fill them in; the values shown are the defaults (Amazon Neptune).
    # port: 8182
    # use_iam: true
    # TLS (wss://). Neptune requires it; set false (with use_iam: false) only
    # for a plain TinkerPop Gremlin Server, e.g. docker/compose.local.yaml.
    # use_ssl: true
    # Gremlin connection pool size (max concurrent in-flight requests over the
    # websocket). Raised to indexing.neptune.index_concurrency when that is
    # larger, so concurrent write batches are not serialized. Query traversals
    # beyond it wait on the event loop. 4 matches the query threads (2 x vCPUs)
    # of the default db.r6g.large; raise it with the instance size.
    pool_size: 4

  # OpenSearch Configuration
  opensearch:
    endpoint: # Add endpoint here
    # Commented out like the Neptune keys above; the values are the defaults.
    # port: 443
    # use_ssl: true
    # verify_certs: true
    # use_iam: false
    # Connect with no auth at all, for a local OpenSearch with the security
    # plugin disabled (docker/compose.local.yaml). Cannot be combined with
    # use_iam or username/password.
    # allow_anonymous: false
    # SigV4 signing service name for IAM auth. "es" for Amazon OpenSearch Service
    # (managed domains); "aoss" for OpenSearch Serverless collections.
    sigv4_service_name: "es"

  # S3 Configuration
  s3:
    bucket_name: # Add bucket name here
    encryption:
      # BUCKET_DEFAULT (default): send no SSE header, so the bucket's default
      #   encryption applies (e.g. the CDK stack's KMS CMK with use_cmk=true).
      # AES256: force SSE-S3 per object (overrides a bucket CMK default).
      # aws:kms: force SSE-KMS with kms_key_id (required).
      encryption_type: "BUCKET_DEFAULT"
      kms_key_id: null
  # DynamoDB document-status registry for incremental indexing (with
  # providers.doc_status.kind dynamodb, the default). With
  # providers.doc_status.enabled: true each indexing run diffs the corpus
  # against this table (by content hash) and only re-indexes new/changed
  # documents, merging into the live graph.
  dynamodb:
    # On the bundled CDK app (iac/) the Fargate task injects
    # UKR__AWS__DYNAMODB__TABLE_NAME (the IaC table, "graphrag-doc-status-v2" in dev) and
    # UKR__AWS__DYNAMODB__CREATE_TABLE_IF_MISSING=false; these env vars override both keys
    # below. Elsewhere, set table_name yourself.
    table_name: "unified-kg-rag-on-aws-doc-status-v2"
    create_table_if_missing: true
    billing_mode: "PAY_PER_REQUEST"

# Provider preset. "aws" (default): Bedrock, Neptune, OpenSearch, DynamoDB.
# "local" fills in local providers for every key under providers, aws.neptune
# and aws.opensearch that this file leaves unset: Ollama models, a cross-encoder
# reranker and embedded SQLite graph and vector stores and registry (no
# server), plus a retrieval context budget the local model's window accepts (see the
# user guide's "Local mode" and docker/config.local.yaml). A key this file sets
# always wins over the preset, so the providers section and the Neptune and
# OpenSearch connection keys are commented out here; uncomment a key only to
# change it.
backend: "aws"

# Per-role provider selection (defaults shown). Each kind is resolved through
# the provider registry, so a custom kind can be registered without code
# changes here.
# providers:
#   llm:
#     # bedrock | openai_compatible | ollama
#     kind: "bedrock"
#     # Non-Bedrock only: the server endpoint (e.g. http://localhost:11434 for
#     # Ollama, http://localhost:8000/v1 for vLLM / llama.cpp / LM Studio) and,
#     # for an OpenAI-compatible server that needs one, an API key.
#     base_url: null
#     api_key: null
#     timeout_seconds: 300.0
#     max_attempts: 3  # per request on transient errors, including the first
#     # Non-Bedrock only: model limits (Bedrock models take theirs from the
#     # capability catalog). context_window_size is sent to Ollama as num_ctx.
#     context_window_size: 32768
#     max_output_tokens: 8192
#     temperature: 0.0
#     # Non-Bedrock only: "estimate" (script-aware estimate) or "tiktoken"
#     # ([local] extra; downloads its encoding file on first use).
#     tokenizer: "estimate"
#     tiktoken_encoding: "cl100k_base"
#   embedding:
#     # bedrock | openai_compatible | ollama
#     kind: "bedrock"
#     base_url: null
#     api_key: null
#     timeout_seconds: 300.0
#     max_attempts: 3  # per request on transient errors, including the first
#     max_input_tokens: 8192
#   rerank:
#     # bedrock | cross_encoder (sentence-transformers, [local] extra) | none.
#     # Without a working reranker queries keep the fused order (logged, and
#     # kg_rag.rerank_enabled=false on the fusion span).
#     kind: "bedrock"
#     device: null
#     max_length: 512
#     batch_size: 16
#   graph:
#     # neptune | gremlin (a TinkerPop Gremlin Server through aws.neptune with
#     # use_iam: false) | sqlite (an embedded single-host graph, no server;
#     # the indexing.neptune settings apply to it too)
#     kind: "neptune"
#     # SQLite graph file (kind: sqlite); relative to this config file.
#     sqlite_path: ".unified-kg-rag/graph.sqlite3"
#   vector:
#     # opensearch (Amazon OpenSearch Service or a local OpenSearch) | sqlite
#     # (an embedded store answering the same queries: CJK bigrams instead of
#     # nori, no fuzziness, exact kNN; about 100k documents per index). The
#     # indexing.opensearch settings apply to both.
#     kind: "opensearch"
#     # SQLite vector file (kind: sqlite); relative to this config file.
#     sqlite_path: ".unified-kg-rag/vector.sqlite3"
#   doc_status:
#     # dynamodb | sqlite
#     kind: "dynamodb"
#     # Incremental indexing on/off (the one switch; was aws.dynamodb.enabled).
#     enabled: false
#     # SQLite registry file (kind: sqlite); relative to this config file.
#     sqlite_path: ".unified-kg-rag/doc-status.sqlite3"

# Which model serves each role. The provider of each family is
# providers.llm / embedding / rerank.kind above; the ids here are checked
# against it. Any Bedrock model id or inference-profile id works for the
# language models, including models released after this package.
models:
  # The 'default' tier: output fixing, graph extraction, gleaning, claim
  # extraction, community reports, query entity/keyword extraction, answer
  # generation, evaluation. null = anthropic.claude-sonnet-5-5 on Bedrock;
  # required with another provider.
  default: null
  # The 'fast' tier: chunking, translation, description summaries, global and
  # DRIFT search steps, query translation, rewriting and routing. null =
  # anthropic.claude-haiku-5-5 on Bedrock, the default tier's model otherwise.
  fast: null
  # Per-role overrides: a model id, or a tier name to move a role to the
  # other tier. Roles: fixing, chunking, translation, graph_extraction,
  # description_summary, gleaning, claim_extraction, community_report,
  # query_translation, entity_extraction, strategy_selection, query_rewrite,
  # answer_generation, community_relevance, global_map, global_reduce,
  # drift_primer, drift_action, evaluation. For example
  # {answer_generation: "anthropic.claude-opus-5-5", query_rewrite: default}.
  roles: {}
  # The one embedding model: indices, queries, evaluation and the
  # visualization layout all embed with it. Bedrock: one of the supported ids,
  # null = amazon.titan-embed-text-v2:0, dimension null = the model's largest
  # (Titan Embed V2 also takes 256 or 512). Another provider: both required.
  # The dimension is fixed into the index mappings: changing either needs a
  # full re-index.
  embedding:
    model_id: null
    dimension: null
  # Bedrock: null = cohere.rerank-v3-5:0 (or amazon.rerank-v1:0).
  # cross_encoder: a sentence-transformers model name, required.
  rerank: null

# Global Output Fixing Configuration (auto-repair malformed model responses)
fixing:
  enabled: true

# Data Processing Configuration
processing:
  # LLM stages are Bedrock-I/O-bound (CPU/memory near-idle during them), so
  # concurrency can be well above the CPU count. max_concurrency = LLM calls a
  # stage keeps in flight (the next item starts as soon as one finishes).
  # Each Bedrock client's connection pool is sized to the larger of
  # max_concurrency and io_workers (floor 10, cap 200) so concurrent calls
  # reuse connections. Bedrock quotas differ per account, model and Region:
  # lower it if the logs show ThrottlingException retries. Commented out
  # because backend "local" sets 20 (a local model server queues the calls
  # it cannot run at once); uncomment it to change it.
  # max_concurrency: 40
  # Attempts per ingestion LLM item, including the first call (transient
  # errors, timeouts and unparseable output are retried); 1 = no retry.
  max_attempts: 5
  # Threads for blocking query-path I/O (Bedrock calls LangChain runs in the
  # event loop's default executor, Neptune, reranking). Python's default is
  # min(32, CPUs + 4), six on a 2-vCPU task, which caps concurrent queries.
  io_workers: 64
  # true = a whole step that fails (batch call, translation language,
  # evaluator, global map/reduce, DRIFT primer, auto router) logs and degrades
  # instead of raising. Items whose own LLM call fails are always skipped.
  ignore_errors: false
  deduplicate: false
  resolution_method: "minhash"
  # Entities merge when their names are equal after normalization, legal-form
  # removal ("Acme Inc" / "Acme") and dense-script spacing. true also merges
  # names that are only similar (resolution_method at similarity_threshold),
  # in full builds and incremental merges alike; similarity also joins
  # different organizations that share most of their name ("... University" /
  # "... University Hospital").
  fuzzy_entity_resolution: false
  # Fuzzy entity resolution threshold; also used to match claim subjects and
  # objects to entity names.
  similarity_threshold: 0.85

  # Document Parsing
  document_parsing:
    # Fallback for library callers. run-ingestion requires --source-directory
    # (or UKR_SOURCE_DIRECTORY) and ignores this value.
    source_directory: "source"
    # Set a directory to export each parsed document as <stem>.json for
    # inspection (or pass --output-directory); null = no export. The loading
    # stage reuses the parsed documents in memory and never reads the export.
    # Must not be the source directory: .json is a parseable source format, so
    # output there would be re-ingested as new documents on the next run.
    target_directory: null
    # Index suffix this run writes: OpenSearch indices and Neptune labels are
    # named <prefix>-<index_value> (null = "default"). Query the corpus with the
    # same value as run-rag/run-eval --suffix. run-ingestion has no flag for
    # it, so keep one config file per tenant or version.
    index_value: null
    # Identity of the corpus source for incremental indexing: a run only
    # treats registry documents of its own index suffix AND source scope as
    # deleted. null = the resolved source directory. The container entrypoint
    # sets it (UKR__PROCESSING__DOCUMENT_PARSING__SOURCE_SCOPE) to the S3 URI the corpus is synced from.
    source_scope: null

  # Text Chunking
  chunking:
    chunker_type: "intelligent"
    # Chunks are embedded whole and reranked as one document, so max_chunk_size
    # must fit Titan Text Embeddings V2 (8,192 tokens) and Cohere Rerank 3.5
    # (4,096 tokens/document): 8000 chars fits Titan even at ~1 char/token (CJK)
    # and is ~2K English tokens. fallback_chunk_size 4800 ~= 1,200 English
    # tokens, the MS GraphRAG / LightRAG default chunk size. pre_chunk_size is
    # the intelligent chunker's LLM window and is not embedded.
    min_chunk_size: 1000
    max_chunk_size: 8000
    chunk_overlap: 500
    pre_chunk_size: 50000
    pre_chunk_overlap: 500
    fallback_chunk_size: 4800
    max_marker_miss_rate: 0.1

  # Translation
  translation:
    # Run the translation stage. Even when true, translation is skipped as a
    # no-op when source_language == target_language and there are no
    # additional_target_languages (e.g. an English-only corpus pays no LLM cost).
    enabled: true
    # Predominant source language of the corpus: picks the OpenSearch analyzer
    # of the original chunk text and drives the no-op skip. Changing it
    # requires re-indexing the text units.
    source_language: "en"
    # Language of the index: text is translated into it, queries are
    # translated into it, and entity/relationship descriptions are written in it.
    target_language: "en"
    # Extra languages to translate into; each is indexed in its own analyzed
    # translated_text_<language> field and searched lexically.
    additional_target_languages: null

  # Graph Extraction
  graph_extraction:
    max_entities_per_chunk: 50
    max_relationships_per_chunk: 50
    entity_confidence_threshold: 0.0
    # Domain entity categories injected into the extraction prompt's
    # {entity_types} slot. Override to adapt to a domain WITHOUT rewriting the
    # whole prompt — each item is "LABEL: short description" (description
    # optional). Empty list lets the model choose any relevant types.
    # e.g. for biomedical: ["GENE: ...", "DISEASE: ...", "DRUG: ...", "TRIAL: ..."]
    entity_types:
      - "PERSON: Names, individuals, roles, titles"
      - "ORGANIZATION: Companies, institutions, departments, groups"
      - "LOCATION: Places, addresses, geographic areas, facilities"
      - "CONCEPT: Ideas, theories, methodologies, frameworks, principles"
      - "OBJECT: Documents, tools, products, systems, technologies"
      - "EVENT: Meetings, projects, activities, processes, incidents"
      - "TEMPORAL: Dates, time periods, schedules, deadlines"
    # Re-summarize over-long merged descriptions with an LLM (parity with MS
    # GraphRAG summarize_descriptions / LightRAG _handle_entity_relation_summary).
    # Merging an entity seen in many chunks concatenates one fragment per chunk,
    # so a popular entity's description grows unbounded; this collapses any
    # description over the token threshold into one coherent summary. Cheap
    # (below-threshold) entities never reach the LLM.
    description_summarization:
      enabled: true
      # Only re-summarize when the merged description exceeds this many tokens.
      force_summary_threshold_tokens: 600
      # Target length (tokens) of the produced summary.
      max_summary_tokens: 256

    # Provenance grounding — hallucination guard. The extraction prompt asks the
    # model to emit a verbatim source_text span per entity; when enabled, an
    # entity whose span is NOT found in its source chunk (verbatim or by token
    # overlap) is treated as hallucinated (the model invented it from domain
    # priors) and dropped or confidence-penalized. OFF by default: it depends on
    # the model emitting spans and is conservative (never deletes on weak signal),
    # but it is the defense against corpus-absent entities polluting the index.
    entity_grounding:
      enabled: false
      action: "drop" # "drop" removes ungrounded entities/relationships; "penalize" scales confidence/weight (an ungrounded relationship naming an entity its chunk did not extract is still dropped)
      penalty_factor: 0.5 # confidence multiplier when action == "penalize"
      min_span_tokens: 4 # spans shorter than this are treated as grounded (too short to judge); a Han/Hangul/Kana character counts as one token
      min_overlap_ratio: 0.6 # non-verbatim spans need this token-overlap fraction to count as grounded

  # Gleaning (Iterative Information Extraction)
  gleaning:
    enabled: true
    # Rounds per text unit; 1 = MS GraphRAG's default max_gleanings. Later
    # rounds re-glean only the units whose previous answer added a new entity
    # or relationship, so a unit stops once an answer adds nothing new.
    max_rounds: 3
    max_entities_per_prompt: 100
    max_relationships_per_prompt: 100

  # Claim Extraction
  claim_extraction:
    # OFF by default: enabling costs an LLM call per text unit. When ON, local
    # search retrieves matching claims from the claims index and injects them
    # into its context (MS GraphRAG covariates), and simple search includes the
    # claims index in its sweep. Claims subject/object are still not linked into
    # the entity graph.
    enabled: false
    max_entities_per_prompt: 100

# Graph Configuration
graph:
  # Graph Analysis
  analysis:
    # Graph statistics
    statistics:
      calculate_density: true
      calculate_clustering: true
      calculate_diameter: false
      calculate_components: true

  # Community Detection
  community_detection:
    # Run Leiden community detection + LLM community-report generation during
    # indexing. Required for GraphRAG global/drift search. Set false for a
    # lighter LightRAG-only ingestion (mix/hybrid/naive need only entities,
    # relationships, and the relationship vector index) — skips the Leiden pass
    # and all community-report LLM calls.
    enabled: true
    resolution: 1.0
    random_state: 42
    max_levels: 5
    trials: 3
    extra_forced_iterations: 2
    # Maximum members per community (entities at level 0, child communities
    # above): a larger one is partitioned again on its own subgraph until it
    # fits, so a leaf report sees all of its entities and a parent's roll-up
    # all of its child summaries (MS GraphRAG's default is 10).
    max_cluster_size: 20
    min_community_size: 3
    # When true, sweep auto_resolution_candidates and keep the resolution that
    # maximizes modularity (the static `resolution` above is used when false).
    # Off by default: on the coarse upper-level graphs the most modular
    # resolution is a low one that merges unrelated communities.
    auto_resolution: false
    auto_resolution_candidates: [0.1, 0.2, 0.3, 0.5, 0.7, 1.0, 1.5, 2.0, 3.0]
    # Skip the sweep (one full Leiden run per candidate at every level) on
    # graphs larger than this many nodes and use `resolution` instead.
    auto_resolution_max_nodes: 10000

    # Community report generation
    report_generation:
      enabled: true
      max_entities_per_report: 50
      # Token budget for the entity/relationship context packed into a report
      # prompt. Entities are degree-sorted (most-connected first) and packed up
      # to this budget; truncation drops the least-important entities first.
      max_report_context_tokens: 4000
      # Findings per report: short 5-7, medium 7-10, long 10-15.
      content_length: "medium"
      # When a parent community's raw context would overflow the token budget,
      # substitute summaries of its already-generated child sub-community reports
      # for the lowest-priority raw context (MS GraphRAG roll-up) instead of
      # truncating. Requires bottom-up per-level report generation. Set false to
      # keep the flat, truncate-on-overflow behaviour.
      enable_sub_community_rollup: true

  # Graph Visualization
  visualization:
    # Centrality metrics the visualization sizes and plots nodes by (computed
    # when it renders; no ingestion stage reads them).
    centrality:
      calculate_degree: true
      calculate_betweenness: true
      calculate_pagerank: true
      calculate_closeness: false
      calculate_eigenvector: false
      pagerank_alpha: 0.85
      pagerank_max_iter: 100
      betweenness_k: null
      # With betweenness_k null (exact), graphs larger than this many nodes
      # switch to sampled betweenness with this pivot count; exact all-pairs
      # betweenness is O(V*E) and stalls on large graphs.
      betweenness_auto_sample_threshold: 2000
      # Seed for sampled betweenness, so centrality is reproducible.
      betweenness_seed: 42
      eigenvector_max_iter: 1000
      eigenvector_tol: 0.001

    # Off by default: rendering during ingestion embeds every node and reduces
    # the embeddings to a layout on each run.
    enabled: false
    # With enabled: false, still write visualization_data.json (graph and
    # communities; no embedding call, layout or centrality) so run-visualization
    # can render on demand.
    export_data: true
    # Unset (default): ingestion writes to <cache dir>/<pipeline_id>/visualization,
    # so visualization_data.json is uploaded with the S3 cache sync (the sync
    # copies .json only; re-render the HTML with run-visualization). Set a path
    # to write elsewhere.
    # outputs_directory: "outputs/visualization"
    embedding_method: "description"
    layout_method: "umap"

    # Node embeddings come from the embedding model (models.embedding). Set
    # embedding_method: "none" to skip embeddings and fall back to a spring
    # layout.

    # Dimensionality-reduction layout hyperparameters, keyed by method. Each
    # also takes random_state (default 42, so a re-render gives the same
    # layout; null for a random one, which lets UMAP run in parallel).
    layout:
      umap:
        n_neighbors: 15
        min_dist: 0.1
      tsne: {}
      pca: {}

    # Interactive (pyvis) renderer settings.
    interactive:
      physics_enabled: false
      # Keep only the top-N nodes by degree in interactive_graph.html; larger
      # pages do not render usably in a browser. 0 or null disables the cap.
      max_nodes: 2000

    # Static (Bokeh) renderer settings.
    static:
      figure_width: 900
      figure_height: 600

# Indexing Configuration
indexing:
  reset: false
  additional_suffix: null
  # Incremental runs cluster only their delta, so an entity an earlier run
  # clustered joins a second level-0 community. At this share of the run's
  # clustered entities the run logs a WARNING recommending indexing.reset
  # and sets the community_rebuild_recommended metric.
  community_drift_threshold: 0.5
  # Maximum tolerated per-index-type write failure rate before the indexing
  # stage is marked FAILED. A fully-failed index type (0 successes) always
  # fails; this additionally catches PARTIAL failures (e.g. most relationship
  # edges dropped) that would otherwise be reported as a successful run. The
  # same rate bounds the share of communities left without a report before the
  # community detection stage fails; below it their documents are recorded
  # FAILED and retried on the next incremental run. Set to 1.0 to disable the
  # partial-failure gate.
  max_failure_rate: 0.2
  # Incremental runs only (providers.doc_status.enabled): a document recorded FAILED
  # this many consecutive runs with unchanged content is no longer retried. It
  # stays FAILED and is skipped as unchanged (WARNING per run) until the file
  # changes or this value is raised.
  max_document_failures: 3
  # Incremental runs only: once runs died this many consecutive times (the task
  # was killed, e.g. out of memory; a stopped or failed run does not count)
  # processing a document's unchanged content, the runs isolate it. A document
  # that died processed alone is quarantined: the next run removes what the
  # attempts wrote, records it QUARANTINED, skips it until its content or the
  # extraction settings change (or this value is raised), and emits the
  # total_documents_quarantined metric. Otherwise the next runs process half of
  # the documents it died with and defer the other new and changed documents
  # (total_documents_deferred) until the culprit is alone.
  max_document_attempts: 3
  # Incremental runs only: the term of the index namespace's write lease. A run
  # holds it from its first stage to its end, renewing it every sixth of the
  # term, so no other run writes the namespace meanwhile (a second run stops
  # with NamespaceLeaseError). A run stops writing once less than a third of
  # the term is left since its last renewal, so keep it at least three times
  # the longest store write request. A run that dies stops renewing: its
  # lease expires at most this long after.
  lease_seconds: 300
  # Incremental runs only: former source scopes whose registry records in this
  # run's index suffix are treated as deleted, so their exclusive graph and
  # vector content is removed (shared content is kept). Use it once after
  # moving a corpus whose source_scope was the default (the absolute source
  # directory, e.g. "/data/corpus-old"), or after changing a fixed
  # source_scope ("s3://bucket/old-prefix/"). Never the run's own scope (the
  # run fails). run-ingestion --retire-source-scope SCOPE adds to this list.
  retire_source_scopes: []

  # OpenSearch Indexing
  opensearch:
    refresh_after_batch: true
    # Persist the content-hash embedding cache to S3 so unchanged text is not
    # re-embedded across separate runs (each Fargate task is a fresh
    # process). Requires aws.s3.bucket_name. Off by default.
    persist_embedding_cache: false
    embedding_cache_s3_key: "embedding-cache/cache.json"
    text_units_index_prefix: "graphrag-text-units"
    entities_index_prefix: "graphrag-entities"
    community_reports_index_prefix: "graphrag-community-reports"
    # Build the relationship VECTOR index (embeds Relationship.description).
    # LightRAG mix/hybrid query it (high-level keywords, incident edges), as do
    # GraphRAG local (relationship section, bridge relationships) and the
    # simple/drift index sweeps; auto routes to these, only global does without
    # it. Set false to skip the relationship embeddings (mix/hybrid lose
    # high-level retrieval, local its relationship section) — symmetric with
    # graph.community_detection.enabled (the LightRAG-only escape hatch). The
    # Neptune relationship EDGES are always built regardless (both methodologies
    # traverse them for graph expansion); this toggles only the vector index.
    build_relationship_vector_index: true
    # Relationship vector index name prefix (used when the above is true).
    relationships_index_prefix: "graphrag-relationships"
    # Claim (covariate) vector index — makes extracted claims searchable.
    claims_index_prefix: "graphrag-claims"
    # Extraction store: each text unit's extracted entities, relationships and
    # claims, keyed by a hash of its text and the extraction settings (models,
    # prompts, grounding, gleaning, claims). A chunk whose text and settings
    # are unchanged is never extracted again, in a full build, an incremental
    # run or another document (--force-rebuild re-extracts and rewrites them).
    # No embeddings. A record stays while a stored text unit names it: a full
    # build or indexing.reset keeps only its text units' records, and an
    # incremental run deletes those only removed text units named.
    extraction_records_index_prefix: "graphrag-extraction-records"
    # Text analyzer per language code (extend without code changes); unlisted
    # languages use default_analyzer. The cluster must have it: nori is the
    # analysis-nori plugin, which an Amazon OpenSearch Service domain has only
    # once its optional Nori package is associated (cjk is built in; the CDK
    # deployment sets ko through UKR__INDEXING__OPENSEARCH__LANGUAGE_ANALYZERS__KO).
    default_analyzer: "standard"
    language_analyzers:
      en: "english"
      ko: "nori"
    # Most hits one query returns (a fetch by id returns every listed id, up
    # to index_settings.max_result_window).
    max_query_size: 100

    # Index settings (applied at index creation)
    index_settings:
      number_of_shards: 1
      # Env UKR__INDEXING__OPENSEARCH__INDEX_SETTINGS__NUMBER_OF_REPLICAS overrides; the CDK stack sets 1 on a
      # multi-node domain. Existing indices keep theirs (PUT <index>/_settings).
      number_of_replicas: 0
      # Search-visibility latency vs indexing throughput; raise (e.g. "30s" or
      # "-1" to disable) for faster bulk loads, then reset for live querying.
      refresh_interval: "1s"

    # Vector search settings
    vector_search:
      ef_construction: 128
      m: 24
      # Candidates a query explores. faiss/nmslib: the index setting
      # index.knn.algo_param.ef_search, fixed at index creation. lucene ignores
      # that setting; the retriever sends it as each kNN query's k (at least
      # the hits it returns), so on lucene it applies from the next query.
      ef_search: 100
      space_type: "cosinesimil"
      # Engine choice is constrained by space_type + OpenSearch version:
      #   lucene HNSW  -> supports cosinesimil on all versions; max 1024 dims
      #                   (covers the default Titan Embed V2 at 1024).
      #   faiss  HNSW  -> supports only l2/innerproduct until OpenSearch 2.19;
      #                   faiss + cosinesimil is REJECTED at index creation on
      #                   2.13. For >1024-dim models, use engine: faiss with
      #                   space_type: innerproduct (embeddings are normalized).
      engine: "lucene"

  # Neptune Indexing
  neptune:
    entity_label_prefix: "Entity"
    community_label_prefix: "Community"
    batch_size: 100
    # Concurrent write batches (and relationship edges, one per request)
    # submitted to Neptune. 1 (default) = sequential
    # indexing; >1 fans batches over a thread pool, multiplexed across the
    # Gremlin connection pool (aws.neptune.pool_size, raised to at least this
    # value). Each batch accumulates its own stats, merged on completion.
    index_concurrency: 1
    # Attempts per Neptune indexer request (writes, read-backs, drops, label
    # clears), including the first (1 = no retry). Every error is retried
    # except one a retry cannot fix (a malformed query, access denied, a bad
    # parameter: PERMANENT_NEPTUNE_ERROR_CODES, or a client-side
    # ValueError/TypeError), which fails on the first attempt.
    max_attempts: 4
    # Base of the full-jitter exponential backoff: the wait after attempt n is
    # random between 0 and retry_delay_seconds * 2^(n-1) seconds.
    retry_delay_seconds: 2
    # Max characters per Neptune property value. Keep it above the longest
    # description that is not re-summarized (description_summarization only
    # triggers above 600 tokens, ~2,400 characters).
    property_max_length: 4000
    # Graph-traversal tuning for retrieval (neighbor expansion). max_hops is
    # honored directly by the retriever (NeptuneIndexingConfig default 3).
    max_hops: 3
    # At most this many neighbours per node and hop (bounds hub fan-out).
    max_results_per_hop: 50
    # Graph-expansion relevance: distance from the seeds first (seeds always
    # first), entity importance only among entities at the same distance.
    # Importance: "rank" (indexed entity rank), "degree" (edge count, computed
    # at query time) or "none" (neutral 0.5 for every entity, the old
    # behaviour). Each is normalized by the largest value in the result.
    entity_importance_source: "rank"
    # Expansion returns the seeds plus top_k * retrieval_multiplier * this
    # many entities, split evenly across the seeds, ranks them, and keeps
    # every seed plus the top top_k * retrieval_multiplier others.
    # 1 = keep every traversed entity.
    traversal_fetch_multiplier: 3

# Search Configuration
search:
  # Strategies the AUTO router may pick (simple is left out; any strategy can
  # still be selected explicitly). global and drift are skipped when
  # graph.community_detection.enabled is false (no community reports). The router model
  # (models.roles.strategy_selection) is on the fast tier: a one-word
  # classification run before retrieval stays off the critical path.
  auto_routable_strategies: ["local", "mix", "global", "drift"]

  # Hybrid search weights: a hybrid search runs a lexical and a kNN search
  # per index, min-max normalizes each over its own hits and takes their
  # weighted mean. Read at query time.
  hybrid:
    lexical_weight: 0.5
    vector_weight: 0.5

  # Fusion Configuration
  fusion:
    method: "rrf"
    rrf_k: 60
    # MMR: 1.0 = pure relevance (filtering skipped), 0.0 = maximum diversity.
    diversity_lambda: 0.5
    # Per-source-bucket weights. Both methods apply them: "rrf" scales each
    # bucket's 1/(rrf_k + rank) term, "weighted" scales its scores. A bucket
    # without a key weighs 1.0. The buckets the strategies emit: local
    # (graph_entities, text_units, relationships, bridge_relationships,
    # community_reports, claims), LightRAG (lightrag_entities,
    # lightrag_relationships, lightrag_endpoint_entities,
    # lightrag_incident_relationships, lightrag_chunks,
    # lightrag_linked_chunks), simple (opensearch_all), global
    # (opensearch_community_reports, text_units) and drift (results).
    fusion_weights: {}

  # Reranking Configuration
  reranking:
    enabled: true
    top_k: 100
    # true fails the query (RerankModelError) when the rerank model cannot be
    # built, a rerank call fails or returns nothing usable. false keeps the
    # fused order instead; either way metadata.rerank reports what happened
    # (applied, disabled, unavailable, skipped or failed).
    required: false

  # LightRAG dual-level keyword search (mix/hybrid/naive modes)
  lightrag_search:
    # When keyword extraction yields nothing, a query shorter than this falls
    # back to using the raw query as a low-level keyword (0 disables the gate).
    raw_query_fallback_max_len: 50
    # Two separate retrieval widths, as in LightRAG: the entity/relationship
    # vector queries are sized independently of the chunk stream. Both act as
    # floors — a larger caller top_k wins.
    kg_stream_top_k: 40
    chunk_stream_top_k: 20
    # Chunks allocated per matched entity/relationship when following text-unit
    # lineage (slots decrease across matches so the last match still gets one).
    related_chunk_number: 5
    # hybrid/mix: additionally expand matched entities through Neptune
    # (indexing.neptune.max_hops). Off by default, as in upstream LightRAG: the
    # one-hop incident edges and relationship endpoints are already retrieved.
    enable_graph_expansion: false

  # Global Search Configuration (MS GraphRAG global search)
  global_search:
    # The cut of the community hierarchy whose reports are all mapped,
    # counted from the root as MS GraphRAG's community_level (default 2 there
    # too): the communities at this depth plus the leaves above it. 0 = the
    # root communities (fewest, broadest); a large value = the leaves.
    community_depth: 2
    # Most reports one cut (or one dynamic-selection step) contributes. A
    # bigger cut is cut to the reports most similar to the query and the
    # search metadata says so (global_level_capped). Bounded by
    # indexing.opensearch.max_query_size.
    max_reports_per_level: 100
    # MS GraphRAG dynamic community selection instead of a fixed cut: rate the
    # root reports, descend into the relevant ones' children (down to
    # community_depth), then map the relevant reports. One fast-model call per
    # rated report.
    use_dynamic_selection: false
    # Dynamic selection keeps a report rated at least this (1-10 rating / 10).
    # 0.2 = anything above irrelevant, MS GraphRAG's 1 on its 0-5 scale.
    relevance_threshold: 0.2
    enable_map_reduce: true
    # Minimum community results before map-reduce synthesis kicks in; below
    # this the results are returned directly (the non-map-reduce path).
    map_reduce_min_results: 3
    # MS GraphRAG map-reduce knobs. MAP rates community-report key points
    # (0-100) for the query, FILTER+RANK drops low-scored points, PACK fits the
    # ranked points into a token budget, REDUCE synthesizes the answer from them.
    # Report tokens packed into one map LLM call (MS GraphRAG data_max_tokens);
    # map calls run processing.max_concurrency at a time.
    map_context_tokens: 12000
    # Drop map key points whose 0-100 score is at or below this (0 keeps any
    # positive score).
    map_relevance_threshold: 0
    # Token budget for the ranked key points fed to the reduce step.
    max_map_reduce_tokens: 8000
    # false (default): the packed key points go straight to the answer model.
    # true: a reduce LLM first summarizes them and the answer model rewrites
    # that summary (the previous two-step behaviour, one extra LLM call).
    reduce_with_llm: false
    # Text units of the communities behind the key points added to the
    # context (reranked). 0 = none, as in MS GraphRAG's global search.
    text_unit_slots: 0

  local_search:
    # Drop graph-expanded entities appearing in more than this many text units
    # (too generic to be discriminative for local search). The query's own
    # matched (seed) entities are always kept.
    entity_frequency_threshold: 20
    # Also fetch the relationships incident to the graph-expanded entities,
    # edges between two retrieved entities first (needs the relationship
    # index). false = only the relationship vector query, as before.
    include_bridge_relationships: true
    # Reserved fusion slots per section type, as max(multiplier * top_k, floor).
    # Without reserved slots one type takes the whole flat top_k cut and crowds
    # out the document chunks that carry the answer.
    type_quota:
      text_multiplier: 2.0
      text_floor: 20
      entity_multiplier: 1.0
      entity_floor: 10
      relationship_multiplier: 1.0
      relationship_floor: 10
      community_multiplier: 0.5
      community_floor: 2
      claim_multiplier: 0.5
      claim_floor: 2

  # Drift Search Configuration (MS GraphRAG DRIFT search)
  drift_search:
    # The query is expanded into a hypothetical report-shaped answer (HyDE);
    # the k_followups community reports most similar to it are split over
    # primer_folds primer calls, each drafting an intermediate answer and
    # follow-up queries. Then, for n_depth rounds, the k_followups open
    # follow-up queries whose parent answer scored best each run a local
    # search and are answered (with new follow-ups) by models.roles.drift_action.
    # Up to k_followups * n_depth local searches and action calls per query.
    k_followups: 20
    primer_folds: 5
    n_depth: 3
    # Token budget of the local-search context one follow-up is answered from.
    local_context_tokens: 12000
    # Token budget for the ranked intermediate answers given to the answer model.
    max_answer_tokens: 8000

  # Token Manager Configuration
  token_manager:
    # Prompt-side retrieval context budget. 30000 = upstream LightRAG's total
    # context budget (MS GraphRAG uses 12000); a budget derived from a 1M window
    # (~785K) never binds, so nothing is ever trimmed. Always clamped to what
    # the answer model accepts. null derives it from the model's window minus
    # the answer request's output reservation (its max_tokens, see
    # aws.bedrock.default_max_output_tokens) and the headroom below. Commented
    # out because backend "local" sets 22000 (what the local model's 32768
    # window accepts) unless providers.llm sets context_window_size or
    # kind: bedrock; uncomment it to change it.
    # max_context_tokens: 30000
    # Share of the window held back for the system prompt, question, history,
    # and token-estimation error when deriving the budget above.
    context_window_headroom_ratio: 0.1
    token_count_cache_size: 1024
    # A section truncated below this many tokens is dropped rather than emitted
    # as an unusable fragment.
    min_truncated_section_tokens: 64
    # Relative shares of the context window per section type. Each type is packed
    # against its own share, so no type can crowd out another; shares are
    # renormalized over the types actually present in a query's candidates. A
    # share a type cannot fill goes to the types that still have candidates (by
    # share; LightRAG mix/hybrid give it to chunks first).
    type_budgets:
      text: 0.50
      entity: 0.20
      relationship: 0.13
      community: 0.10
      claim: 0.07
      general: 0.10

  # How long a query waits for one OpenSearch or Neptune request (and for
  # opening a Neptune connection), and how many attempts an OpenSearch query
  # request gets on a timeout or a 429/502/503/504. A store that does not
  # answer fails the query instead of answering from no context. Ingestion
  # keeps its own, longer limits.
  store_timeout_seconds: 30
  store_max_attempts: 3

# Memory Configuration
memory:
  max_conversations: 100
  max_messages_per_conversation: 20
  max_conversation_age_hours: 168

# Cache Configuration
cache:
  ttl_seconds: 86400  # cache entry TTL in seconds; null = never expire; ignored with --s3-sync (bucket lifecycle expires checkpoints)
  chunking:
    enabled: true
    chunk_size: 1000
    max_file_size_mb: 50
  llm_responses:  # ingestion model responses, reused by a re-run with the same pipeline id
    enabled: true
    flush_every: 100  # responses per segment file (written/uploaded when full and per stage)

# Logging Configuration
logging:
  level: "INFO"
  log_format: "structured"
  log_to_file: true
  log_file_path: "logs/log.txt"  # CLIs only; relative to the working directory
  # Per-logger levels for chatty third-party libraries (langchain_aws logs an
  # INFO line per model call). Setting this map REPLACES the defaults below.
  library_levels:
    langchain_aws: "WARNING"
    botocore: "WARNING"
    urllib3: "WARNING"
    opentelemetry: "ERROR" # the OTLP exporter warns on every retry

# Observability (OpenTelemetry tracing). Off by default; needs the `otel` extra
# (`uv sync --extra otel`). Spans cover the ingestion run/stages/batches and
# each query (strategy, retrieval, fusion, rerank, context build) plus every
# model call with its token usage. The OTLP endpoint, headers (e.g. a collector
# API key) and timeout come from environment variables, never from this file:
# the standard OTEL_EXPORTER_OTLP_ENDPOINT / _HEADERS / _TIMEOUT / _PROTOCOL,
# or for the vendor backends LANGFUSE_HOST / LANGFUSE_PUBLIC_KEY /
# LANGFUSE_SECRET_KEY and PHOENIX_COLLECTOR_ENDPOINT / PHOENIX_API_KEY. Fill
# the keys from Secrets Manager or ECS task secrets at runtime.
# OTEL_SDK_DISABLED=true turns tracing off regardless. UKR__OBSERVABILITY__ENABLED
# and UKR__OBSERVABILITY__BACKEND override `enabled` and `backend` (the CDK
# stacks set them with enable_cloudwatch_tracing).
observability:
  enabled: false
  # none:     send spans to the process's global OpenTelemetry tracer provider
  #           (set up by a host application or `opentelemetry-instrument`).
  # otlp:     export over OTLP (http/protobuf; grpc with
  #           OTEL_EXPORTER_OTLP_PROTOCOL=grpc).
  # langfuse: OTLP to Langfuse (HTTP only) with Langfuse observation types.
  # phoenix:  OTLP to Arize Phoenix with OpenInference span kinds and token
  #           counts (default endpoint: a local server on port 6006).
  # The vendor backends need the `otel` extra only, no vendor SDK.
  backend: "none"
  # Record prompt and completion text on model spans. Off: spans carry counts,
  # ids, timings and token usage only.
  capture_content: false
  # Fraction of root traces kept (otlp, langfuse, phoenix); child spans follow
  # the root. With `none` the host's tracer provider decides.
  sample_rate: 1.0
  # service.name; also the Phoenix project (OTEL_SERVICE_NAME and
  # PHOENIX_PROJECT_NAME win when set).
  service_name: "unified-kg-rag"
  # Regular expressions replaced with [REDACTED] in captured content and, for
  # otlp/langfuse/phoenix, in every exported string attribute, event attribute
  # and status message (session/user ids and exception messages included).
  redact_patterns: []
  # Upper bound on one export request in seconds (OTEL_EXPORTER_OTLP_TIMEOUT
  # wins when set). Exports run in a background thread; this bounds the
  # flush at exit.
  export_timeout_seconds: 10

# Evaluation Configuration
evaluation:
  outputs_directory: "outputs/evaluation"
  # The deterministic, LLM-free evaluators cost nothing and skip a query
  # that lacks their dataset fields, so they are on by default.
  enabled_evaluators:
    - langchain      # LLM judge: correctness / partial_correctness
    - ragas          # LLM judge: RAGAS metrics below
    - answer_match   # answer_contains (headline) + SQuAD exact_match /
    #                  token_f1 vs `answer` (+ `metadata.answer_aliases`)
    - retrieval      # hit@k / recall@k / MRR of the reported sources vs
    #                  `reference_sources` (+ attributable_fraction)
    - graph_aware    # entity/relationship coverage (= recall) vs
    #                  `expected_entities` / `expected_relationships`
  langchain_metrics:
    - correctness
    - partial_correctness
  ragas_metrics:
    - answer_correctness
    - answer_relevancy
    - context_precision
    - context_recall
    - faithfulness
  # Token cap on the context passed to the RAGAS judges. null = the answer
  # model's budget (search.token_manager.max_context_tokens), so the judges see
  # what the answer model saw; a smaller value logs a warning.
  max_context_tokens: null
  # Reasoning effort for the LLM judge (ragas + langchain evaluators) on
  # adaptive-thinking models (Claude 4.7+). Judge calls are short
  # extraction/classification prompts; "low" keeps each RAGAS metric well inside
  # ragas_timeout. null inherits the judge model's tier effort
  # (aws.bedrock.default_effort by default). Ignored by other models.
  judge_effort: "low"
  # RAGAS RunConfig. ragas_timeout is the budget (seconds) for scoring ONE
  # metric on ONE sample, including all of its judge calls and retries; a
  # timed-out job yields NaN for that metric. RAGAS' own default (180s) is too
  # tight for thinking judges. Lower ragas_max_workers if Bedrock throttles the
  # judge (throttled calls burn the per-job timeout). ragas_max_attempts is the
  # total attempts per judge call.
  ragas_timeout: 300
  # Top-ranked contexts per sample scored by RAGAS context_precision (applied
  # before max_context_tokens), which makes one judge call PER context, so
  # strategies reporting 100+ sources (e.g. LightRAG mix) time out without a
  # cap: the metric is context_precision@N. faithfulness / context_recall see
  # every context within max_context_tokens. The answer model's context is
  # unchanged. Per-query counts: judge_contexts / context_precision_contexts
  # in the report metadata. null = no cap.
  ragas_max_contexts: 20
  ragas_max_workers: 8
  ragas_max_attempts: 3
  # Cutoff k for the retrieval evaluator's hit@k / recall@k: the top k distinct
  # files of the reported sources, in rank order.
  retrieval_k: 5
  # Normalization of answer_match exact_match / token_f1: "default" keeps
  # minus signs, decimal points and "C++"; "official_squad" is the SQuAD v1.1
  # script, so scores compare with published MuSiQue / HotpotQA numbers.
  answer_normalization: "default"
  save_detailed_results: true

# Custom Prompts Configuration
# Checked at load: an unknown {variable} or a missing data variable (such as
# {input_text}) is an error. Write a literal brace as {{ or }}.
custom_prompts:
  # Graph Extraction Prompts
  graph_extraction_system: null
  graph_extraction_human: null

  # Description Summarization Prompts (over-long merged descriptions)
  description_summarization_system: null
  description_summarization_human: null

  # Claim Extraction Prompts
  claim_extraction_system: null
  claim_extraction_human: null

  # Graph Refinement Prompts
  graph_refinement_system: null
  graph_refinement_human: null

  # Community Report Prompts
  community_report_system: null
  community_report_human: null

  # Global-search MAP-step Prompts (rates each community report's key points
  # against the query in the map-reduce path).
  global_map_system: null
  global_map_human: null

  # Answer Generation Prompts
  answer_generation_system: null
  answer_generation_human: null

  # Entity Extraction Prompts
  entity_extraction_system: null
  entity_extraction_human: null

  # Pairwise Judge Prompts (run-eval --pairwise-judge; JSON verdict per criterion)
  pairwise_comparison_system: null
  pairwise_comparison_human: null

  # Follow-up Rewrite Prompts (a memory query with history is rewritten as a
  # standalone question before retrieval)
  query_rewrite_system: null
  query_rewrite_human: null

  # Strategy Selection Prompts
  strategy_selection_system: null
  strategy_selection_human: null

  # Dual-level (high/low) Keyword Extraction Prompts (LightRAG mix/hybrid modes)
  keywords_extraction_system: null
  keywords_extraction_human: null

  # Prompt-tuning Prompts (run-prompt-tuning): corpus profiling that produces
  # domain-adapted custom_prompts (few-shot examples are now generated by running
  # the real GraphExtractor over sampled chunks, so they need no prompt override).
  corpus_profile_system: null
  corpus_profile_human: null
  # DRIFT search: query expansion (HyDE), primer, and the answer to one
  # follow-up query from its local-search context
  drift_hyde_system: null
  drift_hyde_human: null
  drift_primer_system: null
  drift_primer_human: null
  drift_action_system: null
  drift_action_human: null

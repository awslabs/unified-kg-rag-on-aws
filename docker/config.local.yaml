# Local mode with the stores in containers: every component runs on this
# machine, no AWS account needed.
#
# backend: local fills in the local providers for every key this file leaves
# unset (see the user guide's "Local mode" for the full list and the expected
# differences from AWS mode):
#   - language models and embeddings: Ollama at localhost:11434
#   - reranking: a sentence-transformers cross-encoder ([local] extra; without
#     it queries keep the fused order)
#   - graph, vector/lexical store and incremental-indexing registry: SQLite
#     files (no server)
#
# This file swaps the embedded graph and vector stores for the Gremlin Server
# and OpenSearch containers of docker/compose.local.yaml (the same query
# engine as Amazon OpenSearch Service, with nori and fuzzy matching). Without
# the containers, drop the --config-path and pass --backend local instead.
#
#   uv sync --extra local
#   docker compose -f docker/compose.local.yaml --profile models up -d --wait
#   docker compose -f docker/compose.local.yaml exec ollama ollama pull qwen2.5:7b-instruct
#   docker compose -f docker/compose.local.yaml exec ollama ollama pull bge-m3
#   uv run run-ingestion --config-path docker/config.local.yaml --source-directory ./source
#   uv run run-rag --config-path docker/config.local.yaml --query "..."
#
# To keep Bedrock for the models and use only the local stores, set
# providers.llm/embedding/rerank.kind: bedrock (with model ids from the Bedrock
# catalog) and provide AWS credentials.
#
# This file sets only what differs from the preset. The preset's values are
# shown commented out; uncomment one to change it.

backend: local

providers:
  graph:
    kind: gremlin
  vector:
    kind: opensearch
  # llm:
  #   # Any model pulled into Ollama. Small models extract noticeably weaker
  #   # graphs than the Bedrock defaults; use the largest one your hardware
  #   # runs. fast_model_id (chunking, translation, summaries, the global/DRIFT
  #   # map steps) defaults to it.
  #   default_model_id: "qwen2.5:7b-instruct"
  # embedding:
  #   # The dimension is fixed into the OpenSearch mappings: changing the
  #   # model or the dimension needs a full re-index.
  #   model_id: "bge-m3"
  #   dimension: 1024
  # rerank:
  #   model_id: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  doc_status:
    # Incremental indexing: re-runs only re-index new and changed documents.
    enabled: true
    # Relative to this file: the repository's .unified-kg-rag/ directory.
    sqlite_path: "../.unified-kg-rag/doc-status.sqlite3"

# aws:
#   neptune:
#     # TinkerPop Gremlin Server: plain ws://, no SigV4.
#     endpoint: localhost
#     port: 8182
#     use_ssl: false
#     use_iam: false
#   opensearch:
#     # Security plugin disabled: plain http, no auth.
#     endpoint: localhost
#     port: 9200
#     use_ssl: false
#     verify_certs: false
#     allow_anonymous: true

logging:
  log_to_file: false

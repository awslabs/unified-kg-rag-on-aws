# Config baked into the data-plane image as /app/config.yaml.
#
# Intentionally endpoint-free: the CDK compute stack injects every
# deployment-specific value as an environment variable, and ConfigLoader
# applies those on top of this file (AWS_REGION, UKR__AWS__BEDROCK__REGION_NAME,
# UKR__AWS__NEPTUNE__ENDPOINT, UKR__AWS__OPENSEARCH__ENDPOINT, UKR__INDEXING__OPENSEARCH__INDEX_SETTINGS__NUMBER_OF_REPLICAS (1 on a
# multi-node domain), UKR__AWS__S3__BUCKET_NAME, UKR__AWS__DYNAMODB__TABLE_NAME,
# UKR__AWS__DYNAMODB__CREATE_TABLE_IF_MISSING, UKR__LOGGING__LOG_FORMAT and, when a guardrail is
# deployed, UKR__AWS__BEDROCK__GUARDRAIL__IDENTIFIER / UKR__AWS__BEDROCK__GUARDRAIL__VERSION). The source
# directory and pipeline id arrive per run via UKR_SOURCE_DIRECTORY /
# UKR_PIPELINE_ID.
#
# Every key not listed here uses the default documented in
# config-template.yaml. Only settings where the deployed stack differs from
# those defaults belong in this file.

aws:
  opensearch:
    # The IaC domain authorizes IAM-signed (SigV4) requests from the task role;
    # it has no basic-auth user.
    use_iam: true

providers:
  doc_status:
    # Incremental indexing on the DynamoDB registry. The stack provisions the
    # table (KMS, PITR, alarms); its name is injected via
    # UKR__AWS__DYNAMODB__TABLE_NAME.
    enabled: true

logging:
  # The container logs to stdout, which the awslogs driver ships to CloudWatch.
  log_to_file: false

# GitLab pipeline secret detection (the Gitleaks-based analyzer) on the
# internal mirror: the default rules, plus one narrow exception. The URL
# redaction tests under tests/unit/ feed the redactors made-up credentials
# (a URL's user and a fake password such as "secret" or "token"), each line marked
# `# gitleaks:allow`; the "Password in URL" rule allows only those fake
# user:password pairs, only in those test files. Every other rule, path and
# credential is scanned as by default. The analyzer reads this file only where
# ruleset customization is enabled (it logs "ruleset customization not
# enabled" otherwise): the inline `# gitleaks:allow` is what holds everywhere,
# so a test that needs only a URL carries no userinfo at all.
[secrets]
  [[secrets.passthrough]]
    type   = "raw"
    target = "gitleaks.toml"
    value  = """
[extend]
# The analyzer's packaged default ruleset (do not change the path).
path = "/gitleaks.toml"

[[rules]]
id = "Password in URL"
  [[rules.allowlists]]
  description = "Made-up credentials of the URL redaction tests"
  condition = "AND"
  paths = ['''^tests/unit/test_[a-z0-9_]+\\.py$''']
  regexTarget = "match"
  regexes = ['''[a-z]+:(?:secret|token|pw|p|SECRET)@''']
"""

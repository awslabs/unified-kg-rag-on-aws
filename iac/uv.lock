version = "0.0.0"
source = { virtual = "." }
dependencies = [
    { name = "aws-cdk-aws-neptune-alpha" },
    { name = "aws-cdk-lib" },
    { name = "cdk-nag" },
    { name = "constructs" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "aws-cdk-aws-neptune-alpha", specifier = ">=2.272.0a0" },
    { name = "aws-cdk-lib", specifier = ">=2.272.0,<3.0.0" },
    { name = "cdk-nag", specifier = ">=2.38.2,<3.0.0" },
    { name = "constructs", specifier = ">=10.8.1,<11.0.0" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = ">=9.1.1" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-kg-rag-on-aws"
# Version is sourced from unified_kg_rag.__version__ via [tool.hatch.version].
dynamic = ["version"]
description = "AWS-native Knowledge Graph RAG on Bedrock, Neptune & OpenSearch — GraphRAG and LightRAG over one hexagonal ingestion, indexing, and hybrid-search stack."
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Amazon.com, Inc. or its affiliates"},
]
keywords = ["aws", "bedrock", "graphrag", "hexagonal-architecture", "knowledge-graph", "lightrag", "neptune", "opensearch", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    # Imported directly to bound and sign gremlinpython's websocket handshake
    # (adapters/aws/neptune.py); gremlinpython pins its line.
    "aiohttp>=3.9.0,<4.0.0",
    "aws-assume-role-lib>=2.10.0",
    "bokeh>=3.9.2",
    "boto3>=1.43.66",
    # Imported directly (exceptions, Config, retries); boto3 pins its line.
    "botocore>=1.43.66",
    # Encoding detection for non-UTF-8 text sources (parser + Document loader).
    "charset-normalizer>=3.4.0",
    # Only used for `Dataset.from_dict` in the ragas evaluator. The previous
    # <4.0.0 ceiling held ragas back to 0.3.2, which imports a module that
    # langchain-community removed in 0.4 — see the ragas floor below.
    "datasets>=4.0.0",
    "datasketch>=2.0.0",
    # Leiden is called here directly, as graspologic's wrapper does; graspologic
    # itself is not a dependency (its import loads its embed stack, and boto3
    # through gensim/smart_open).
    "graspologic-native>=1.2.1",
    # Pinned below 3.8: that release added the `discard()` step and routes
    # `Cardinality.single` property writes through it, which Neptune (engine
    # 1.4.7.0, TinkerPop 3.6/3.7) rejects with
    # `InternalFailureException: Could not locate method:
    # NeptuneGraphTraversal.discard()`. Every vertex and edge write fails, so a
    # real ingest indexes 0 entities. Unit tests use a fake Neptune client and
    # cannot see this. Raise only once Neptune's engine reports TinkerPop 3.8.
    "gremlinpython>=3.6.3,<3.8.0",
    # LangChain 1.x. The floors are the releases that carry the fixes for
    # GHSA-qh6h-p6c9-ff54 (langchain-core path traversal), GHSA-gr75-jv2w-4656
    # (langchain loader path traversal), GHSA-fv5p-p927-qmxr (splitter SSRF) and
    # GHSA-2g6r-c272-w58r; none of them were backported to 0.3.x, so the old
    # `<1.0.0` ceiling made them unreachable. langchain-classic supplies the
    # legacy `langchain.*` modules that 1.x removed (evaluation, memory,
    # OutputFixingParser) and is a direct import, so it is declared here.
    "langchain>=1.3.9,<2.0.0",
    # 1.8.1 is the first release that raises BedrockContextOverflowError (a
    # langchain-core ContextOverflowError) for a prompt longer than the model's
    # context; on older releases it is a plain ValidationException, which the
    # retrievers treat as fatal (store_errors.is_fatal_retrieval_error).
    "langchain-aws>=1.8.1,<2.0.0",
    "langchain-classic>=1.0.0,<2.0.0",
    # Held at 0.3.x: ragas imports langchain_community.chat_models.vertexai
    # unconditionally, and 0.4 removed that module — 0.4 also puts the whole
    # package into sunset, so the document loaders used by the parser should move
    # to standalone packages rather than follow it forward.
    "langchain-community>=0.3.27,<0.4.0",
    "langchain-core>=1.5.3,<2.0.0",
    "langchain-text-splitters>=1.1.2,<2.0.0",
    # Imported directly to warn when LangSmith tracing is on (shared/logging.py).
    "langsmith>=0.3.45,<1.0.0",
    "llvmlite>=0.48.0",
    "lxml>=6.0.0",
    "nest-asyncio>=1.6.0",
    "networkx>=3.4",
    "numpy>=1.26.4",
    "opensearch-py>=3.0.0",
    "pandas>=2.3.1",
    # 13.0.0 fixes the critical/high Pillow advisories.
    "pillow>=13.0.0",
    "pydantic>=2.11.7",
    "pypdf>=6.15.0",
    "python-dotenv>=1.1.1",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.2",
    # ragas 0.3.2 imports langchain_community.chat_models.vertexai, removed in
    # community 0.4, so it cannot coexist with LangChain 1.x. Every ragas that
    # can requires datasets>=4.0.0.
    "ragas>=0.4.3,<0.5.0",
    # Instructor (via ragas) requires Rich <15 for OpenAI 2.x compatibility.
    "rich>=14.3.3,<15.0.0",
    "scikit-learn>=1.7.1",
    "structlog>=25.4.0",
    "tenacity>=9.1.2",
    "tqdm>=4.70.0",
    "umap-learn>=0.5.6",
]

[project.scripts]
run-ingestion = "unified_kg_rag.application.cli.launch:run_ingestion"
run-rag = "unified_kg_rag.application.cli.launch:run_rag"
run-eval = "unified_kg_rag.application.cli.launch:run_eval"
run-visualization = "unified_kg_rag.application.cli.launch:run_visualization"
run-prompt-tuning = "unified_kg_rag.application.cli.launch:run_prompt_tuning"
prepare-benchmark = "unified_kg_rag.application.cli.launch:prepare_benchmark"

[project.optional-dependencies]
# Optional: enables .md/.markdown/.html/.htm source parsing (heavy transitive
# deps, so not installed by default). The ParserFactory registers those formats
# only when this is importable; .txt/.csv/.json/.pdf work without it.
unstructured = [
    "unstructured[md]>=0.24.1",
]
# Optional: OpenTelemetry tracing (`observability.enabled: true`). The core
# package imports none of these; the OTel adapter loads them only when
# observability is enabled, and fails fast naming this extra when they are
# missing. The OTLP exporter speaks http/protobuf by default and gRPC when
# OTEL_EXPORTER_OTLP_(TRACES_)PROTOCOL=grpc.
otel = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
]
# Optional: local mode (`backend: local` / `providers.*.kind`). OpenAI-compatible
# servers (vLLM, llama.cpp, LM Studio) and Ollama for the LLM and embeddings,
# tiktoken for `providers.llm.tokenizer: tiktoken`, and a sentence-transformers
# cross-encoder for `providers.rerank.kind: cross_encoder` (pulls in PyTorch;
# without it reranking is skipped with a warning), and the Porter stemmer of
# the embedded SQLite vector store's `english` analyzer (without it that
# analyzer does not stem, with a warning). The core package imports none of
# these; the local adapters load them only when their kind is selected.
local = [
    "langchain-ollama>=1.0.0,<2.0.0",
    "langchain-openai>=1.1.14,<2.0.0",
    "sentence-transformers>=5.1.0",
    "snowballstemmer>=2.2",
    "tiktoken>=0.12.0",
]

[tool.uv]
# Ragas pulls in this package transitively; earlier releases allow SSRF through
# image token counting (GHSA-r7w7-9xr2-qq2r).
constraint-dependencies = ["langchain-openai>=1.1.14"]

[project.urls]
Repository = "https://github.com/awslabs/unified-kg-rag-on-aws"

[tool.hatch.version]
path = "unified_kg_rag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["unified_kg_rag"]

[tool.hatch.build.targets.sdist]
# Ship only the package + top-level project files; never bundle build/venv
# artifacts (IaC CDK venvs, caches, references) into the source distribution.
only-include = ["unified_kg_rag", "README.md", "LICENSE", "pyproject.toml"]

[tool.black]
line-length = 88
# Match requires-python's floor.
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["unified_kg_rag"]
skip_gitignore = true

[tool.ruff]
line-length = 88
# Must track requires-python's floor: pyupgrade (UP) rewrites code to the target
# version's idioms, so a newer target would introduce syntax the floor lacks.
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "G",  # flake8-logging-format (enforce %-style lazy logging, no f-strings)
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "UP042", # str+Enum is intentional (StrEnum changes str()/format semantics)
    # G201 calls need case-by-case handling; the rest of the G ruleset
    # (G004 f-strings, G002/G010/G101/...) guards new code.
    "G201",  # logging.error(..., exc_info=True) vs logging.exception()
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["B018"]

[tool.mypy]
# Type-check against the oldest supported interpreter, so stdlib symbols added
# after it are reported here rather than at a user's import time.
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "gremlin_python.*",
    "datasketch.*",
    "graspologic_native",
    "networkx.*",
    "pandas.*",
    "pyvis.*",
    "ragas.*",
    "sklearn.*",
    "snowballstemmer",
    "umap.*",
    "datasets.*",
    "lxml.*",
    "nest_asyncio.*",
    "tqdm.*",
    "yaml.*",
    "bokeh.*",
    # [otel] extra only; the dev group installs the SDK but no exporter.
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Real-AWS tests keep the real environment (tests/conftest.py), so a plain
# `pytest` with store endpoints exported must not select them; `-m aws` on the
# command line overrides this selector.
addopts = '--tb=short --strict-markers -m "not aws"'
asyncio_mode = "auto"
# Fail a hung test (e.g. an unmocked network wait or a deadlocked pool) after
# two minutes instead of letting it burn the whole CI job. The slowest test
# takes a few seconds; override per test with @pytest.mark.timeout(n).
timeout = 120
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests (hypothesis)",
    "aws: Tests requiring real AWS services (skipped by default)",
    "slow: Tests that take over 5 s (deselect with -m \"not slow\" for a quick run)",
]
# Silence only known third-party deprecations so new ones (including our own)
# stay visible. gremlin_python: camelCase step aliases kept for Neptune's
# TinkerPop line; numba: transitive via umap; ragas: the
# metric imports and LangchainLLMWrapper are deprecated in the pinned 0.x line.
filterwarnings = [
    "ignore::DeprecationWarning:gremlin_python",
    "ignore::DeprecationWarning:numba",
    "ignore:Importing .* from 'ragas.metrics' is deprecated:DeprecationWarning",
    "ignore:LangchainLLMWrapper is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["unified_kg_rag"]
omit = [
    "tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
# Dev toolchain (PEP 735). `uv sync` installs it by default; `--no-dev` skips
# it (the Docker image); pip >= 25.1 installs it with `pip install --group dev`.
dev = [
    "black>=25.9.0",
    "hypothesis>=6.165.2",
    "isort>=5.12.0",
    # The Ollama adapters of the [local] extra, for their offline tests (the
    # rest of the extra is heavy; the cross-encoder tests fake it).
    "langchain-ollama>=1.0.0,<2.0.0",
    "moto[dynamodb,s3]>=5.2.2",
    "mypy>=2.3.0",
    # In-memory span exporter for the observability tests (the [otel] extra
    # without its exporters).
    "opentelemetry-sdk>=1.30.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.1",
    # The embedded engine's english stemmer (a [local] extra), so its analyzer
    # tests run in CI instead of skipping.
    "snowballstemmer>=2.2",
    # boto3 type stubs (mypy only): boto3-stubs covers the top-level boto3
    # package; types-boto3 covers the per-service clients used under TYPE_CHECKING.
    "boto3-stubs~=1.43.66",
    "types-boto3[full]>=1.43.71",
]

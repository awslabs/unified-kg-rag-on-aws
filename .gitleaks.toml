# gitleaks configuration, loaded automatically from the scanned directory
# (`gitleaks dir .` / `gitleaks git .`). It keeps gitleaks' default rules and
# allows the two findings of `generic-api-key` that are not secrets. Each
# entry matches the line's text, not its number, so an edit elsewhere in the
# file cannot move it, and it covers the tree and the history alike. How to
# run the scan: CONTRIBUTING.md, "Checks to run before pushing".

[extend]
useDefault = true

[[allowlists]]
description = "Labels and model names that generic-api-key reads as a key"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  # The console's "Tokens per question" label (i18n key
  # `evaluate.tokensPerQuery` in console/web/src/i18n/locales/*.json).
  '''"evaluate\.tokensPerQuery":''',
  # The tokenizer model name `claude-opus-4.7`.
  '''claude-opus-4\.7''',
]

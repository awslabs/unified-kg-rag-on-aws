# gitleaks configuration, loaded automatically from the scanned directory
# (`gitleaks dir .` / `gitleaks git .`). It keeps gitleaks' default rules and
# allows the two findings of `generic-api-key` that are not secrets. Each
# entry matches the whole secret the rule reports (whole-match), not the line
# it is on, so a real key beside either text is still found; matching text,
# not a line number, an edit elsewhere in the file cannot move it, and it
# covers the tree and the history alike. How to run the scan:
# CONTRIBUTING.md, "Checks to run before pushing".

[extend]
useDefault = true

[[allowlists]]
description = "Labels and model names that generic-api-key reads as a key"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  # The console's "p50 latency" i18n key, which the rule reads as the
  # value of the `evaluate.tokensPerQuery` line before it
  # (console/web/src/i18n/locales/*.json).
  '''^evaluate\.latencyP50$''',
  # The tokenizer model name `claude-opus-4.7`.
  '''^claude-opus-4\.7$''',
]
